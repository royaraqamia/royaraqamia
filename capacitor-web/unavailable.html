<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>رؤيَة رقَميَّة</title>
    <style>
      /*
        The shell's local fallback (ADR-0067).

        Capacitor loads this page from `https://localhost/unavailable.html` when
        a main-frame navigation fails, and when the installed System WebView is
        below `android.minWebViewVersion`. It is copied into the APK by
        `cap sync`, so it has to stand on its own: no external stylesheet,
        script, font or image.

        It paints nothing on purpose. The page used to explain the failure and
        offer a retry; the app now shows the site's own background and no
        notice at all, so an unreachable site reads as an empty screen rather
        than a second, different screen (the 2026-10-30 withdrawal of the
        offline card and `/offline`).

        The script is deliberately ES5. This page is shown *because* the
        WebView may be old, so it cannot use the syntax the site's bundles use.
        The version check below reads the major from the WebView's own user
        agent; `scripts/__tests__/shell-fallback.test.mjs` pins it to the
        Capacitor config and refuses modern syntax here.
      */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #121216;
        color: #f5f5f5;
      }

      body {
        --gutter: 24px;
        box-sizing: border-box;
      }

      /* The page must not sit under a system bar on an edge-to-edge WebView.
         This is the same env() fallback the site uses; an older WebView
         ignores the max() declarations and keeps the plain `padding` above
         (ADR-0054). */
      body {
        padding-top: max(var(--gutter), env(safe-area-inset-top));
        padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
        padding-inline-start: max(var(--gutter), env(safe-area-inset-left));
        padding-inline-end: max(var(--gutter), env(safe-area-inset-right));
      }

      @media (max-width: 360px) {
        body {
          --gutter: 12px;
        }
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var MINIMUM_WEBVIEW = 111;
        // The per-session guard for #447's auto-recovery: written before the
        // listener navigates, read by the next page load in this session. One
        // failed main-frame load still produces one page load (ADR-0067), and
        // reconnect produces exactly one automatic reload, never a loop.
        var RECOVERY_FLAG = 'rqq-unavailable-recovered';

        var match = /Chrome\/(\d+)/.exec(navigator.userAgent || '');
        var current = match ? parseInt(match[1], 10) : 0;
        var outdated = current > 0 && current < MINIMUM_WEBVIEW;

        // An engine below the floor cannot run the site, and reconnecting does
        // not change that: the page stays empty and arms nothing.
        if (outdated) return;

        /**
         * The one automatic attempt: the first `online` event after a failed
         * main-frame load navigates to the canonical origin, once per session.
         * Still no timer — the radio coming back is the only trigger — and the
         * storage guard turns every page after the first recovery back into
         * ADR-0067's tap-only page, so a site that stays down cannot drag this
         * WebView into a reload loop.
         */
        try {
          if (sessionStorage.getItem(RECOVERY_FLAG) !== null) return;
        } catch (storageErr) {
          // A denied Storage lets this page attempt one recovery; the flag
          // is only the loop guard for the page loads after this one.
        }

        var onOnline = function () {
          window.removeEventListener('online', onOnline);
          try {
            sessionStorage.setItem(RECOVERY_FLAG, '1');
          } catch (storageErr) {}
          window.location.assign('https://royaraqamia.com');
        };
        window.addEventListener('online', onOnline, { once: true });
      })();
    </script>
  </body>
</html>
