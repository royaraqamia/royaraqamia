name: 'Code Quality'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          cache-next: 'false'

      - name: Format Check
        run: npx prettier --check .

      - name: Env Docs Sync
        run: npm run check:env-docs

      - name: Arabic Spelling & Diacritic Order
        run: npm run check:arabic

      - name: Digits Are ASCII
        run: npm run check:digits

      - name: Generated Contracts Are Current
        run: npm run check:contracts

      - name: Generated Tokens Are Current
        run: npm run check:tokens

      - name: Surface Matrix
        run: npm run check:surfaces

      - name: Screen Inventory
        run: npm run check:screens

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          cache-next: 'false'

      - name: Test with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        shell: bash
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json');
            const fmt = (v) => v.pct.toFixed(1) + '% (' + v.covered + '/' + v.total + ')';
            const rows = ['statements', 'branches', 'functions', 'lines']
              .map((k) => '| ' + k[0].toUpperCase() + k.slice(1) + ' | ' + fmt(s.total[k]) + ' |');
            ['| Metric | Coverage |', '| --- | --- |', ...rows]
              .forEach((line) => require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n'));
          "

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WHATSAPP_PHONE: '963968478904'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ievboaylytxgtijconak.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_S6OJdmRtfmL_trKAY1ypqQ_WZYRjVK2'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Reads the .next output from the build above and fails when a route
      # exceeds perf/budget.json. See docs/performance.md.
      - name: Shipped-weight budget
        run: npm run perf:check

      # Also reads .next: the committed public/sw-precache.js has to match what
      # the build derives, and every public page has to either be prerendered or
      # be declared dynamic by design (#557).
      - name: Precache list is complete and current
        run: npm run check:precache
