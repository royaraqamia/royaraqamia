name: 'Code Quality'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          cache-next: 'false'

      - name: Format Check
        run: npx prettier --check .

      - name: Env Docs Sync
        run: npm run check:env-docs

      - name: Arabic Spelling & Diacritic Order
        run: npm run check:arabic

      - name: Digits Are ASCII
        run: npm run check:digits

      # A request is not an origin (ADR-0178): a self-hosted Next server reports
      # the address it listens on, so request-derived absolute URLs advertised
      # `https://localhost:10000` in production.
      - name: Absolute URLs Come From Configuration
        run: npm run check:origin

      # A loopback callback port is chosen at run time (RFC 8252 §7.3), so a
      # redirect URI is compared as a parsed value, never as a string: one call
      # site that compares text refuses the second launch of every native client
      # (ADR-0179).
      - name: Redirect URIs Are Compared As Parsed Values
        run: npm run check:redirect-uri

      - name: The Bot Writes Fusha
        run: npm run check:fusha

      # The terminal, the bot and the product assistant answer by the same rules
      # (ADR-0136): a rule edited on one door and not the others fails here.
      - name: Agent Doors Agree
        run: npm run check:agent-behaviour

      # A headless run has nobody to answer a permission prompt, so every surface
      # must resolve to allow or deny (ADR-0142): the config is checked against the
      # CLI's own defaults, and one probe that resolves to `ask` fails the job.
      - name: No Permission Prompt Is Reachable
        run: npm run check:runner-permissions

      - name: Generated Contracts Are Current
        run: npm run check:contracts

      - name: Generated Copy Is Current
        run: npm run check:copy

      - name: Generated Currency Table Is Current
        run: npm run check:currency

      - name: Ported Components Match The Site
        run: npm run check:parity

      - name: Generated Component Recipes Are Current
        run: npm run check:components

      - name: Generated Icon Vectors Are Current
        run: npm run check:vectors

      - name: Generated Tokens Are Current
        run: npm run check:tokens

      # The Quran search index is a build artifact of the vendored text: it must
      # match a fresh build of it, and stay inside the budget the page load pays.
      - name: Quran Search Index Is Current
        run: npm run check:quran-search

      - name: Surface Matrix
        run: npm run check:surfaces

      # A shell component may not pair a base utility with a breakpoint variant:
      # a surface emits the base class too and outranks the shell, so the variant
      # silently stops applying (ADR-0132).
      - name: Style Layers
        run: npm run check:layers

      - name: Screen Inventory
        run: npm run check:screens

      # A native port is switched on by evidence, not by a review (#874,
      # ADR-0118): this refuses an enabled screen with no recorded pair.
      - name: Visual Gate
        run: npm run check:visual

      # Every screen is on the list, and the list agrees with what is switched
      # on (#882): this refuses a surface nobody planned.
      - name: Screen Plan
        run: npm run check:plan

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          cache-next: 'false'

      - name: Test with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        shell: bash
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json');
            const fmt = (v) => v.pct.toFixed(1) + '% (' + v.covered + '/' + v.total + ')';
            const rows = ['statements', 'branches', 'functions', 'lines']
              .map((k) => '| ' + k[0].toUpperCase() + k.slice(1) + ' | ' + fmt(s.total[k]) + ' |');
            ['| Metric | Coverage |', '| --- | --- |', ...rows]
              .forEach((line) => require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n'));
          "

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WHATSAPP_PHONE: '963968478904'
          # The public origin is read while prerendering (ADR-0178) and would
          # otherwise throw in a production build. It is public by definition.
          NEXT_PUBLIC_SITE_URL: 'https://royaraqamia.com'
          PUBLIC_ORIGIN: 'https://royaraqamia.com'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ievboaylytxgtijconak.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_S6OJdmRtfmL_trKAY1ypqQ_WZYRjVK2'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Reads the .next output from the build above and fails when a route
      # exceeds perf/budget.json. See docs/performance.md.
      - name: Shipped-weight budget
        run: npm run perf:check

      # Also reads .next: the committed public/sw-precache.js has to match what
      # the build derives, and every public page has to either be prerendered or
      # be declared dynamic by design (#557).
      - name: Precache list is complete and current
        run: npm run check:precache
