# The dead-man's switch for the web release train.
#
# The train is only as reliable as its trigger. A Release run that never starts,
# one that fails, or one the release guard skipped leaves `main` with commits
# whose version nobody cuts: the number is owed, and no later run recomputes it
# (ADR-0052). Nothing else in the repository notices a train that is behind.
#
# This workflow only alerts. It deliberately does not re-dispatch the train: a
# failed Release run is usually a build failure or a push that could not be
# rebased, and a retry every fifteen minutes is a red run every fifteen minutes,
# not a fix. One alert issue, opened once, updated while the backlog stands, and
# closed by the run that finds the train level again.
#
# GitHub's `schedule` is best-effort and can land late, which a version owed by an
# hour can afford; `workflow_dispatch` is there for the impatient.

name: 'Release Health'

on:
  schedule:
    # Every fifteen minutes: the threshold below is two release cycles, so a real
    # stall is reported within three quarters of an hour of the commit that owes it.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The threshold lives beside the rule it belongs to: scripts/release-health.mjs.
      - name: Read the train's backlog
        id: train
        run: node scripts/release-health.mjs >> "$GITHUB_OUTPUT"

      - name: Open, update or close the alert
        env:
          STALLED: ${{ steps.train.outputs.stalled }}
          COUNT: ${{ steps.train.outputs.count }}
          SHA: ${{ steps.train.outputs.sha }}
          SUBJECT: ${{ steps.train.outputs.subject }}
          AGE_MINUTES: ${{ steps.train.outputs.age_minutes }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ALERT_LABEL = 'release:alert';
            const ALERT_TITLE = 'Release train is behind on main';
            const stalled = process.env.STALLED === 'true';
            const commitsUrl = context.serverUrl + '/' + owner + '/' + repo + '/commits/main';
            const runsUrl =
              context.serverUrl + '/' + owner + '/' + repo + '/actions/workflows/release.yml';

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: ALERT_LABEL,
              per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title === ALERT_TITLE);

            if (!stalled) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: 'Recovered: `main` is level with the train again — every commit is under a release commit.',
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
                core.info('Closed release alert #' + existing.number + '.');
              } else {
                core.info('The train is level with main; no alert to raise.');
              }
              return;
            }

            const body = [
              'The web release train is behind on `main`: these commits have no release commit above them, so the version they are owed was never cut.',
              '',
              '- unreleased commits: **' + process.env.COUNT + '**',
              '- owed since: `' + process.env.SHA + '` — ' + process.env.SUBJECT +
                ' (' + process.env.AGE_MINUTES + ' minutes ago)',
              '',
              'A release cuts every commit since the last tag, so one run releases all of them.',
              'Look at the `Release` runs for this commit below: a build failure or a push that',
              'could not be rebased is re-run from the Actions tab, and a commit with no run at all is',
              'released by dispatching the workflow.',
              '',
              '- [Commits on main](' + commitsUrl + ')',
              '- [Release runs](' + runsUrl + ')',
              '',
              '_Maintained by `.github/workflows/release-health.yml` (ADR 0052)._',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info('Updated release alert #' + existing.number + '.');
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: ALERT_LABEL,
                color: 'b60205',
                description: 'The web release train is behind on main',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            const created = await github.rest.issues.create({
              owner,
              repo,
              title: ALERT_TITLE,
              body,
              labels: [ALERT_LABEL],
            });
            core.info('Opened release alert #' + created.data.number + '.');
