# The dead-man's switch for the Android release train (ADR-0089).
#
# The weekly train is only as reliable as its trigger. A release run that never
# starts — GitHub's `schedule` is best-effort and can be disabled after repository
# inactivity — or one that fails, leaves native changes on `main` that no APK
# carries. Nothing else notices: the site keeps serving the last manifest, and
# every installed shell is simply told nothing forever.
#
# This workflow only alerts. It deliberately does not dispatch the train: a failed
# release is usually a build failure or a missing release note, and a retry every
# hour is a red run every hour, not a fix. One alert issue, opened once, updated
# while the backlog stands, and closed by the run that finds the train level again.

name: 'Release Health'

on:
  schedule:
    # Daily, after the Monday train has had its day. A release is due every seven
    # days; one that is two days late is the point at which nobody is coming.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # The threshold lives beside the rule it belongs to:
      # scripts/android-release.mjs (`STALE_DAYS`).
      - name: Read the train's backlog
        id: train
        run: node scripts/android-release.mjs --health >> "$GITHUB_OUTPUT"

      - name: Open, update or close the alert
        env:
          STALLED: ${{ steps.train.outputs.stalled }}
          RELEASE: ${{ steps.train.outputs.release }}
          NEXT: ${{ steps.train.outputs.next }}
          AGE_DAYS: ${{ steps.train.outputs.age_days }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ALERT_LABEL = 'release:alert';
            const ALERT_TITLE = 'Android release is overdue on main';
            const stalled = process.env.STALLED === 'true';
            const commitsUrl = context.serverUrl + '/' + owner + '/' + repo + '/commits/main';
            const runsUrl =
              context.serverUrl + '/' + owner + '/' + repo + '/actions/workflows/android-release.yml';

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: ALERT_LABEL,
              per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title === ALERT_TITLE);

            if (!stalled) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: 'Recovered: the weekly train is level with `main` again — native changes have an APK behind them.',
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
                core.info('Closed release alert #' + existing.number + '.');
              } else {
                core.info('The train is level with main; no alert to raise.');
              }
              return;
            }

            const body = [
              'The Android release train is overdue on `main`: these native changes have no APK behind them, so no user can receive them.',
              '',
              '- version the batch earns: **' + (process.env.NEXT || 'unknown') + '**',
              '- oldest unreleased change: **' + process.env.AGE_DAYS + ' day(s)** old',
              '',
              'A release grades everything since the last `android-*` tag, so one run ships all of it.',
              'A failed run is usually a build failure or a shell change without a release note; dispatch',
              'the workflow to cut it now, and it will not wait for the weekly schedule.',
              '',
              '- [Commits on main](' + commitsUrl + ')',
              '- [Android release runs](' + runsUrl + ')',
              '',
              '_Maintained by `.github/workflows/release-health.yml` (ADR-0089)._',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info('Updated release alert #' + existing.number + '.');
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: ALERT_LABEL,
                color: 'b60205',
                description: 'The Android release train is overdue on main',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            const created = await github.rest.issues.create({
              owner,
              repo,
              title: ALERT_TITLE,
              body,
              labels: [ALERT_LABEL],
            });
            core.info('Opened release alert #' + created.data.number + '.');
