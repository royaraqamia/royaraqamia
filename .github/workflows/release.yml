name: 'Release'

on:
  workflow_run:
    workflows: ['Code Quality']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the next release without committing/tagging/pushing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Fetch Tags Explicitly
        run: git fetch --tags --force

      - name: Verify the Tested Commit Is Still Releasable
        id: releasable
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          # A manifest commit is pushed by the Shell Release workflow with
          # GITHUB_TOKEN, which starts no workflows — so it has no pipeline of its
          # own, and skipping it loses the version this merge is owed. The rule,
          # its one exception, and the verdict a run that lost the race gets (it
          # skips: the newer commit's own run cuts every commit since the last tag,
          # which includes this one) live in scripts/release-guard.mjs — which uses
          # the runner's own Node, importing nothing outside the standard library.
          # ADR-0052.
          tested="${{ github.event.workflow_run.head_sha }}"
          if ! verdict=$(node scripts/release-guard.mjs --tested "$tested"); then
            echo "::error title=Refused to cut a version for this commit::$verdict"
            exit 1
          fi
          printf '%s\n' "$verdict"
          printf '%s\n' "$verdict" | head -n 1 >> "$GITHUB_OUTPUT"

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'

      - name: Idempotency Guard
        id: guard
        shell: bash
        env:
          SUPERSEDED: ${{ steps.releasable.outputs.skip }}
        run: |
          # Two ways a run has nothing to cut, and both are somebody else's
          # version: HEAD is already a tagged release commit, or the commit Code
          # Quality tested is no longer the one on top of `main` (the releasability
          # step above — a newer commit's run cuts the window that contains it).
          if [ "$SUPERSEDED" = 'true' ]; then
            skip=true
            reason="a newer commit on main owns this version"
          else
            reason="HEAD is already a tagged release commit"
            skip=$(node scripts/release-tools.mjs --guard | sed -E 's/^skip=([A-Za-z]+).*/\1/')
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Skip release when another run owns it
        if: steps.guard.outputs.skip == 'true'
        env:
          REASON: ${{ steps.guard.outputs.reason }}
        run: echo "::notice title=Nothing to release::$REASON — no version is cut here"

      - name: Build Verify
        if: steps.guard.outputs.skip != 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_WHATSAPP_PHONE: '963968478904'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ievboaylytxgtijconak.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_S6OJdmRtfmL_trKAY1ypqQ_WZYRjVK2'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Compute Next Version
        id: next
        if: steps.guard.outputs.skip != 'true'
        run: |
          {
            echo "version=$(node scripts/release-tools.mjs --next)"
            echo "tag=$(node scripts/release-tools.mjs --next-tag)"
          } >> "$GITHUB_OUTPUT"

      - name: Rehearse Next Release (dry-run)
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run == true
        run: |
          echo "next release: ${{ steps.next.outputs.tag }} (version ${{ steps.next.outputs.version }})"
          node scripts/release-tools.mjs --next --dry-run

      - name: Bump package.json, Write CHANGELOG.md, Capture Release Notes
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        run: node scripts/release-tools.mjs --apply "${{ steps.next.outputs.version }}" --notes-file "${{ runner.temp }}/release-notes.md"

      - name: Regenerate committed version default
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        run: node scripts/compute-version.mjs

      - name: Commit & Tag & Push
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "royaraqamia bot"
          git config user.email "bot@royaraqamia.com"
          git add package.json package-lock.json CHANGELOG.md backend/config/generated/app-version.ts
          git commit -m "chore(release): $TAG [skip ci]"
          # Two workflows write to `main`, so this push can lose a race. The tag is
          # created inside the loop, on whatever commit the rebase below leaves on
          # the branch: a tag made once, before the loop, outlives the rebase and
          # ends up naming a commit no branch contains.
          #
          # `--atomic` is what keeps a tag from outliving its commit at all.
          # Without it a rejected branch push still lands the tag, and that is how
          # `web-1.101.13` came to name a commit `main` never received — and then
          # every later run died on `fatal: tag 'web-1.101.13' already exists`,
          # because the number was spent but invisible to the tag list this
          # branch can see (ADR-0051).
          for attempt in 1 2 3 4 5; do
            git tag -f -a "$TAG" -m "$TAG"
            if git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$TAG"; then
              exit 0
            fi
            git fetch origin main --quiet
            # The tag is on origin, so another run cut this version first while
            # this one held it. The number is spent; there is nothing to push and
            # nothing to fail — what is still owed goes out with the next release.
            if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
              echo "::warning title=Release already cut::$TAG is already on origin, cut by another run; nothing was pushed. The next change on main releases whatever is still owed."
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            if ! git rebase origin/main; then
              echo "::error title=Could not rebase the release commit::origin/main moved under a version bump that conflicts; the version was not cut. Re-run this workflow."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error title=Could not push the release commit::origin/main kept moving under this run; the version was not cut. Re-run this workflow."
          exit 1

      - name: Create GitHub Release
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.next.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          # `false` on purpose: the Android shell's release claims "Latest" so the APK
          # sits at the top of the releases page instead of drifting down as web
          # releases land. A web release still has its notes and its tag; it is just
          # not the one the page pins.
          make_latest: false
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Sentry Preflight
        id: sentry
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        shell: bash
        env:
          PRESENT: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' }}
        run: |
          if [ "$PRESENT" != "true" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT are not configured — skipping Sentry release association."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Creates/finalizes the Sentry release named after the git tag and
      # links its commits. Vercel's build of the same commit uploads
      # sourcemaps into this same release (next.config.js release name).
      - name: Associate Sentry release with commits
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true && steps.sentry.outputs.enabled == 'true'
        uses: getsentry/action-release@6fb9aeade7061441cf3864e34fbe11a1457ad7dc # v3.7.1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          release: ${{ steps.next.outputs.tag }}
          finalize: false
