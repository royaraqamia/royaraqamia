name: 'Release'

on:
  workflow_run:
    workflows: ['Code Quality']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse the next release without committing/tagging/pushing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Fetch Tags Explicitly
        run: git fetch --tags --force

      - name: Verify Tested Commit Is Still HEAD
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          tested="${{ github.event.workflow_run.head_sha }}"
          current="$(git rev-parse HEAD)"
          if [ "$tested" != "$current" ]; then
            echo "::error::Tested commit ${tested} is no longer HEAD (${current}) — aborting to avoid releasing untested code. The newer commit's own pipeline will release it."
            exit 1
          fi

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'

      - name: Idempotency Guard
        id: guard
        shell: bash
        run: echo "skip=$(node scripts/release-tools.mjs --guard | sed -E 's/^skip=([A-Za-z]+).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Skip release on existing release commit
        if: steps.guard.outputs.skip == 'true'
        run: echo "HEAD is already a tagged release commit — nothing to do"

      - name: Build Verify
        if: steps.guard.outputs.skip != 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_WHATSAPP_PHONE: '963968478904'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ievboaylytxgtijconak.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_S6OJdmRtfmL_trKAY1ypqQ_WZYRjVK2'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Compute Next Version
        id: next
        if: steps.guard.outputs.skip != 'true'
        run: echo "version=$(node scripts/release-tools.mjs --next)" >> "$GITHUB_OUTPUT"

      - name: Rehearse Next Release (dry-run)
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run == true
        run: |
          echo "next version: ${{ steps.next.outputs.version }}"
          node scripts/release-tools.mjs --next --dry-run

      - name: Bump package.json, Write CHANGELOG.md, Capture Release Notes
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        run: node scripts/release-tools.mjs --apply "v${{ steps.next.outputs.version }}" --notes-file "${{ runner.temp }}/release-notes.md"

      - name: Regenerate committed version default
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        run: node scripts/compute-version.mjs

      - name: Commit & Tag & Push
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          git config user.name "royaraqamia bot"
          git config user.email "bot@royaraqamia.com"
          git add package.json package-lock.json CHANGELOG.md backend/config/generated/app-version.ts
          git commit -m "chore(release): v${{ steps.next.outputs.version }} [skip ci]"
          git tag -a "v${{ steps.next.outputs.version }}" -m "v${{ steps.next.outputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.next.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Sentry Preflight
        id: sentry
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        shell: bash
        env:
          PRESENT: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' }}
        run: |
          if [ "$PRESENT" != "true" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT are not configured — skipping Sentry release association."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Creates/finalizes the Sentry release named after the git tag and
      # links its commits. Vercel's build of the same commit uploads
      # sourcemaps into this same release (next.config.js release name).
      - name: Associate Sentry release with commits
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true && steps.sentry.outputs.enabled == 'true'
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: v${{ steps.next.outputs.version }}
          finalize: false
