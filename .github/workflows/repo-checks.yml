name: 'Repo Checks'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
    paths: ['.github/**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The live title, not `github.event.pull_request.title`: the agent workflows
          # rewrite a non-conventional title seconds after opening the pull request, and
          # neither event reaches this job (a GITHUB_TOKEN event starts no run) — the
          # normalizer re-runs this run instead, and a re-run replays the stored payload,
          # which still carries the old title. Reading the pull request keeps a re-run
          # honest.
          TITLE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=Invalid PR title::'$TITLE' does not follow Conventional Commits."
            echo "Expected format: type(optional-scope)[!]: description"
            echo "Valid types: feat fix docs style refactor perf test build ci chore revert"
            echo "Example: feat(community): add draft preview"
            exit 1
          fi

  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify action references are pinned
        run: node scripts/check-actions-pinned.mjs

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  grant-baseline:
    name: Grant Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          cache-next: 'false'

      # The generated artifact gate needs the live project, so it lives here
      # with the secrets rather than beside check:contracts in Code Quality.
      # Pending migrations' GRANTs and REVOKEs are simulated before comparison.
      - name: Live Grants Match The Baseline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run check:grants
