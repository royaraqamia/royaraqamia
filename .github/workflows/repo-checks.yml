name: 'Repo Checks'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
    paths: ['.github/**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The live title, not `github.event.pull_request.title`: the agent workflows
          # rewrite a non-conventional title seconds after opening the pull request, and
          # neither event reaches this job (a GITHUB_TOKEN event starts no run) — the
          # normalizer re-runs this run instead, and a re-run replays the stored payload,
          # which still carries the old title. Reading the pull request keeps a re-run
          # honest.
          TITLE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=Invalid PR title::'$TITLE' does not follow Conventional Commits."
            echo "Expected format: type(optional-scope)[!]: description"
            echo "Valid types: feat fix docs style refactor perf test build ci chore revert"
            echo "Example: feat(community): add draft preview"
            exit 1
          fi

  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
