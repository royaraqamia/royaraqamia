name: 'Repo Checks'

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
    paths: ['.github/**']

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=Invalid PR title::'$TITLE' does not follow Conventional Commits."
            echo "Expected format: type(optional-scope)[!]: description"
            echo "Valid types: feat fix docs style refactor perf test build ci chore revert"
            echo "Example: feat(blog): add draft preview"
            exit 1
          fi

  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Rolling :latest tag on purpose — kept current via Dependabot-less
      # docker tag; actionlint only reads, never executes workflows.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
