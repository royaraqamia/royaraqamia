name: 'Sync Admin Allowlist'

# public.is_admin() reads public.app_settings.admin_emails, and that value's only other
# writer is a successful Admin request (the identity module's `onAdmin` side effect).
# Without this job a revocation waits for an Admin to load /admin, and removing the last
# Admin never converges at all.
#
# The job is deliberately a trigger rather than a courier: it asks the deployed app to
# sync, so the allowlist exists in exactly one place - the app's own ADMIN_EMAILS, which
# /admin already trusts - instead of being mirrored into a second copy of the value here.
#
# Authentication reuses the service role key, which this job needs anyway, so there is no
# additional credential to rotate.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the difference without writing'
        type: boolean
        default: false

concurrency:
  group: sync-admin-allowlist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ask the app to sync its allowlist
        env:
          SYNC_URL: 'https://royaraqamia.com/api/admin/sync-allowlist'
          DRY_RUN: ${{ inputs.dry_run }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          url="${SYNC_URL}"
          if [ "${DRY_RUN}" = "true" ]; then
            url="${url}?dryRun=1"
          fi

          status=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" "${url}")

          cat body.json
          echo "HTTP ${status}"

          test "${status}" = "200"
