name: 'One-off: serve the APK from our own origin'

# Exists for one run and is deleted afterwards (ADR-0047). The host change moves the
# *next* publish automatically; this moves the version that is published now, so an
# installed shell stops depending on a GitHub release asset today rather than at the
# next native change.
#
# It runs in CI because GitHub's asset host is unreachable from the machine this was
# written on, so the file can be neither downloaded nor uploaded from there — and
# because the last step has to fetch the APK through the live site, which is the
# whole point of the change.
#
# The order:
#
#   1. download `royaraqamia-1.0.3.apk` from the release and verify it against the
#      hash this release has always had — nothing after this is meaningful otherwise
#   2. upload it to the storage bucket under the same name (`x-upsert: false`, so an
#      existing object can never be replaced; if one exists it must be this build)
#   3. fetch `https://royaraqamia.com/android/royaraqamia-1.0.3.apk` — the site's own
#      path, rewritten to the bucket — and hash it, which is what a device will do
#   4. point the manifest at that URL, refusing to continue if the sha256 or the size
#      would change
#   5. fetch the live manifest and confirm it names the origin that just served the
#      bytes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Download and verify only; change nothing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  migrate:
    name: Serve the published APK from our origin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p legacy
          gh release download android-1.0.3 -p royaraqamia-1.0.3.apk -D legacy
          ls -l legacy

      - name: Verify it against the hash it was published under
        run: |
          set -euo pipefail
          size=$(stat -c%s legacy/royaraqamia-1.0.3.apk)
          sha=$(sha256sum legacy/royaraqamia-1.0.3.apk | cut -d' ' -f1)
          echo "$size bytes  $sha"
          if [ "$size" != "7447105" ] || [ "$sha" != "78fe6c833d07bb8512d0bfc468739cd086eb2de52fe7ccd08a68e50679edafad" ]; then
            echo "::error title=Unexpected bytes::the release asset is not the file the manifest describes"
            exit 1
          fi

      - name: Upload it to the bucket
        if: inputs.dry_run != true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          url="https://ievboaylytxgtijconak.supabase.co/storage/v1/object/android/royaraqamia-1.0.3.apk"
          sha=$(sha256sum legacy/royaraqamia-1.0.3.apk | cut -d' ' -f1)

          status=$(curl -sS -o "$RUNNER_TEMP/upload.out" -w '%{http_code}' \
            -X POST "$url" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "cache-control: max-age=31536000" \
            -H "x-upsert: false" \
            --data-binary @legacy/royaraqamia-1.0.3.apk || echo "000")
          if [ "$status" = "200" ]; then
            echo "uploaded royaraqamia-1.0.3.apk"
            exit 0
          fi

          echo "upload answered $status"
          head -c 400 "$RUNNER_TEMP/upload.out" || true
          curl -sS -f -o "$RUNNER_TEMP/existing.apk" "$url" || {
            echo "::error title=The APK is not in storage::the upload answered $status and downloading it back failed too"
            exit 1
          }
          existing=$(sha256sum "$RUNNER_TEMP/existing.apk" | cut -d' ' -f1)
          if [ "$existing" != "$sha" ]; then
            echo "::error title=Same version, different bytes in storage::storage holds $existing, the release holds $sha"
            exit 1
          fi
          echo "storage already holds this build"

      - name: Fetch it back through the site, the way a device will
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          url="https://royaraqamia.com/android/royaraqamia-1.0.3.apk"
          status="000"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sSL -o "$RUNNER_TEMP/verify.apk" -w '%{http_code}' --max-time 300 "$url" || echo "000")
            if [ "$status" = "200" ]; then break; fi
            echo "attempt $attempt answered $status"
            if [ "$attempt" = 6 ]; then
              echo "::error title=Our own origin does not serve the APK::$url answered $status — the rewrite is not live (ADR-0047)"
              exit 1
            fi
            sleep 20
          done

          actual=$(sha256sum "$RUNNER_TEMP/verify.apk" | cut -d' ' -f1)
          bytes=$(stat -c%s "$RUNNER_TEMP/verify.apk")
          echo "through the site: $bytes bytes, sha256 $actual"
          expected=$(sha256sum legacy/royaraqamia-1.0.3.apk | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Our own origin served other bytes::the site's copy is not the published APK"
            exit 1
          fi

      - name: Point the manifest at our origin
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          before_hash=$(jq -r .sha256 public/android/latest.json)
          before_bytes=$(jq -r .sizeBytes public/android/latest.json)

          node -e '
            const fs = require("node:fs");
            const path = "public/android/latest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8").replace(/^\uFEFF/, ""));
            manifest.apkUrl = "https://royaraqamia.com/android/" + manifest.apkUrl.split("/").pop();
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          '

          after_hash=$(jq -r .sha256 public/android/latest.json)
          after_bytes=$(jq -r .sizeBytes public/android/latest.json)
          if [ "$before_hash" != "$after_hash" ] || [ "$before_bytes" != "$after_bytes" ]; then
            echo "::error title=The hash moved::moving a manifest to another host may not change the bytes it names"
            exit 1
          fi
          jq -r .apkUrl public/android/latest.json

      - name: Land the manifest
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android/latest.json
          git commit -m "chore(android): serve the published APK from our own origin"
          git fetch origin main --quiet
          git rebase origin/main
          git push origin HEAD:main

      - name: Confirm what a device will read and fetch
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          sleep 20
          manifest=$(curl -sS --max-time 60 "https://royaraqamia.com/android/latest.json")
          echo "$manifest" | jq .
          apk=$(echo "$manifest" | jq -r .apkUrl)
          advertised=$(echo "$manifest" | jq -r .sha256)

          case "$apk" in
            https://royaraqamia.com/*) ;;
            *) echo "::error title=The live manifest still points elsewhere::$apk"; exit 1 ;;
          esac

          curl -sSL -o "$RUNNER_TEMP/live.apk" --max-time 300 "$apk"
          live=$(sha256sum "$RUNNER_TEMP/live.apk" | cut -d' ' -f1)
          echo "live manifest names $apk"
          echo "that URL hashes to    $live"
          echo "the manifest promises $advertised"
          if [ "$live" != "$advertised" ]; then
            echo "::error title=The live manifest and the bytes disagree::a device would refuse this update"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Serve the APK from our own origin"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Dry run**: the published APK was downloaded and verified; nothing was uploaded, rewritten or committed."
            else
              echo "Uploaded \`royaraqamia-1.0.3.apk\` to the \`android\` bucket, fetched it back through https://royaraqamia.com, and pointed the manifest at that origin."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
