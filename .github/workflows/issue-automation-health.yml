# Heartbeat and catch-up for the autonomous issue automation.
#
# GitHub's `schedule` trigger is best-effort: it lands hours late and is sometimes
# dropped for a whole day, which is exactly the failure the planner/implementer
# pipeline cannot detect on its own (a run that never starts cannot report that it
# never started). This workflow is the dead-man's switch: every six hours it checks
# the age of the last successful run of each agent workflow, re-dispatches any that
# lapsed, and opens (or closes) a single tracking issue so a human notices a
# recurring outage.
#
# A run that failed is re-dispatched too, and on a shorter fuse than the 26-hour
# heartbeat: the planner dies on a transient upstream refusal often enough to matter
# (`[prefill_cap_refused] the cell is at capacity`, an upstream 429 that its own five
# attempts at five seconds cannot outlast), and waiting a day to retry a five-minute
# job leaves the pipeline idle for a day. The retry is quiet — the schedule itself is
# on time — so it re-dispatches, logs, and leaves the alert issue to the heartbeat
# condition, which is still what proves the automation is actually degraded.
#
# Every dispatch is fire-and-forget — GitHub answers `204` and can still start
# nothing, which is how the 2026-10-19/20 misses stayed invisible until the 26-hour
# check. So each re-dispatch is confirmed: the run has to appear in the Actions API
# before the catch-up is reported as done, and a dropped dispatch is named as such in
# the issue instead of being counted as a recovery. Six-hourly rather than daily so a
# silent drop is caught within hours, not a day.
#
# Re-dispatching works with the default GITHUB_TOKEN: `workflow_dispatch` is exempt
# from the "token-triggered events do not start workflows" rule the planner and
# implementer rely on, so no extra PAT is needed here. See ADR 0032.

name: 'Issue Automation Health'

on:
  schedule:
    # Every six hours, so a missed heartbeat is caught within hours rather than a day.
    # The ticks are 05/11/17/23 UTC rather than 00/06/12/18: this workflow re-dispatches
    # the planner and the implementer, and 06:00 is the first minute of DeepSeek's
    # second peak window, so a catch-up there started a whole agent day at double
    # price. Every tick below is inside the off-peak stretch (10:00-01:00 UTC plus the
    # 04:00-06:00 gap). ADR 0133.
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: issue-automation-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check heartbeats and recover
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ALERT_LABEL = 'opencode:alert';
            const ALERT_TITLE = 'Issue automation heartbeat missed';
            const STALE_MS = 26 * 60 * 60 * 1000;
            // A run whose conclusion is one of these did not do its work. `timed_out`
            // counts: the job hit its own wall, which is a retry's job to answer, not
            // a heartbeat's.
            const FAILED = new Set(['failure', 'timed_out']);
            const targets = [
              { name: 'Issue Planner', file: 'issue-planner.yml' },
              { name: 'Issue Implementer', file: 'issue-implementer.yml' },
            ];

            // Newest first. `conclusion` is null while a run is queued or in flight,
            // which is what keeps a re-dispatch from stacking on one already on its way.
            const history = async (file) =>
              github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: file,
                per_page: 30,
              });

            const inspect = async (file) => {
              const runs = await history(file);
              const success = runs.find((r) => r.conclusion === 'success') || null;
              const latest = runs.find((r) => r.conclusion !== null) || null;
              const ageMs = success
                ? Date.now() - Date.parse(success.created_at)
                : Number.POSITIVE_INFINITY;
              return {
                success,
                latest,
                inFlight: runs.some((r) => r.status === 'queued' || r.status === 'in_progress'),
                ageHours: success ? (ageMs / 3600000).toFixed(1) : 'never',
                lapsed: !success || ageMs > STALE_MS,
                failed: latest ? FAILED.has(latest.conclusion) : false,
              };
            };

            const lapsed = [];
            const queue = [];
            const lines = [];
            for (const target of targets) {
              const state = await inspect(target.file);
              const last = state.success
                ? 'last success `' + state.success.created_at + '` (' + state.ageHours +
                  'h ago, run ' + state.success.id + ')'
                : 'no successful run on record';
              const latest = state.latest && (!state.success || state.latest.id !== state.success.id)
                ? '; most recent run ' + state.latest.id + ' (' + state.latest.conclusion +
                  ', `' + state.latest.created_at + '`)'
                : '';
              lines.push('- ' + target.name + ': ' + last + latest);
              // A lapsed target is dispatched once, whatever its last run concluded:
              // the retry below is for the schedule that is on time and still failed.
              if (state.lapsed) {
                lapsed.push(target);
                queue.push({ target, because: 'lapsed', inFlight: state.inFlight });
              } else if (state.failed) {
                queue.push({ target, because: 'failed', inFlight: state.inFlight });
              }
            }

            // Re-dispatch each queued workflow and confirm a run actually started.
            // The dispatch call itself proves nothing: GitHub returns 204 for a
            // request it then drops, so a catch-up that is not verified is reported
            // as a recovery that never happened.
            const DISPATCH_WAIT_MS = 90 * 1000;
            const DISPATCH_POLL_MS = 5 * 1000;
            const recoveries = [];
            for (const { target, because, inFlight } of queue) {
              // The workflow's own `Daily guard` makes a redundant dispatch cheap, but
              // it is not free (a runner, a checkout, a minute), and a run already on
              // its way will reach the same conclusion this one would.
              if (inFlight) {
                core.info(target.name + ' has a run queued or in flight; not re-dispatching.');
                recoveries.push({ target, because, skipped: true });
                continue;
              }
              const since = Date.now();
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: target.file,
                  ref: 'main',
                });
              } catch (err) {
                core.error('Could not re-dispatch ' + target.name + ': ' + err.message);
                recoveries.push({ target, because, error: err.message });
                continue;
              }

              let run = null;
              const deadline = Date.now() + DISPATCH_WAIT_MS;
              while (!run && Date.now() < deadline) {
                await new Promise((resolve) => setTimeout(resolve, DISPATCH_POLL_MS));
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: target.file,
                  per_page: 10,
                });
                // A minute of slack absorbs clock skew between the runner and GitHub.
                run = runs.find((r) => Date.parse(r.created_at) >= since - 60000) || null;
              }

              if (run) {
                core.warning(
                  'Re-dispatched ' + target.name + ' (' + because + '); run ' + run.id + ' started.'
                );
              } else {
                core.error(
                  'Re-dispatched ' + target.name + ' (' + because + ') but no run appeared within ' +
                    DISPATCH_WAIT_MS / 1000 + 's — the dispatch was dropped.'
                );
              }
              recoveries.push({ target, because, run });
            }

            const why = { lapsed: 'heartbeat lapsed', failed: 'last run failed' };
            const recoveryLines = recoveries.map(({ target, because, run, error, skipped }) => {
              const reason = why[because] || because;
              if (skipped) return '- ' + target.name + ': a run was already on its way (' + reason + ').';
              if (error) return '- ' + target.name + ': re-dispatch failed, ' + reason + ' (' + error + ').';
              if (run) {
                return '- ' + target.name + ': re-dispatched, ' + reason + '; run ' + run.id + ' started.';
              }
              return (
                '- ' + target.name + ': re-dispatched, ' + reason + ', but no run appeared within ' +
                DISPATCH_WAIT_MS / 1000 + 's. The dispatch was dropped — this is GitHub, not the pipeline.'
              );
            });

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: ALERT_LABEL,
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === ALERT_TITLE);

            if (lapsed.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: 'Heartbeat recovered:\n\n' + lines.join('\n'),
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
                core.info('Closed heartbeat alert #' + existing.number + '.');
              } else {
                core.info(
                  recoveries.length === 0
                    ? 'All heartbeats healthy; no alert to raise.'
                    : 'Every heartbeat is inside its window; re-dispatched ' +
                      recoveries.filter((r) => !r.skipped).length +
                      ' failed run(s) without raising the alert.'
                );
              }
              return;
            }

            const body = [
              'The heartbeat for the autonomous issue automation is late. Checked every six hours.',
              '',
              'Last success and most recent run:',
              ...lines,
              '',
              'Catch-up:',
              ...recoveryLines,
              '',
              "If a dispatch above was dropped, GitHub's Actions delivery is the problem rather than the pg_cron dispatcher (`dispatch_github_workflow`). Either way the next check re-dispatches.",
              '',
              '_Maintained by `.github/workflows/issue-automation-health.yml` (ADR 0032)._',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info('Updated heartbeat alert #' + existing.number + '.');
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: ALERT_LABEL,
                color: 'b60205',
                description: 'Issue automation heartbeat is degraded',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            const created = await github.rest.issues.create({
              owner,
              repo,
              title: ALERT_TITLE,
              body,
              labels: [ALERT_LABEL],
            });
            core.info('Opened heartbeat alert #' + created.data.number + '.');
