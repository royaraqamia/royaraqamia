# The MCP catalogue agent (#1293, half 2).
#
# One run measures a capped page of catalogue rows, sources a mark and the
# Arabic copy from sources it is allowed to use, and writes through a scoped
# endpoint. The deterministic checks decide; the model never publishes.
#
# Rollout (issue #1293, half 3): the ladder is walked and recorded in
# docs/specs/mcp-catalog-agent.md (runs 43070731547, 43071155049, 43072048941 on
# 2026-11-11), so this workflow now runs on a schedule as well as on dispatch.
# `MCP_CATALOG_AGENT_ENABLED` (a repository variable) is the kill switch: with it
# off, `apply` writes nothing and says so.
#
# Secrets:
#   MCP_CATALOG_AGENT_TOKEN - a revocable token the endpoint compares in constant
#                             time; the job holds no service-role key.
#   OPENCODE_API_KEY        - the model step's credential.
#   SUPABASE_PROJECT_REF    - only so the shared runner config can be written.
#
# Variables:
#   MCP_CATALOG_AGENT_URL      - default https://royaraqamia.com
#   MCP_CATALOG_AGENT_ENABLED  - 'true' opens the kill switch
#   MCP_CATALOG_AGENT_CAP      - candidates measured per run (ladder: 3, steady: 20)
#   MCP_CATALOG_AGENT_PUBLISH_CAP - publishes per run (steady: 20)
#   MCP_CATALOG_AGENT_EGRESS_BUDGET - rows measured per run (defaults to the cap)

name: 'MCP Catalogue Agent'

on:
  # Three quarters of an hour after the catalogue sync (`vercel.json`:
  # 0 4 * * *), so a run works on the mirror that was just refreshed.
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Measure and report, write nothing. Leave checked to rehearse.'
        type: boolean
        default: true
      cap:
        description: 'Candidates to measure this run (1-20). Empty uses the variable.'
        type: string
        default: ''

permissions:
  # The opencode action authenticates with OIDC; without this it fails before the model runs.
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: mcp-catalog-agent
  cancel-in-progress: false

jobs:
  measure:
    name: Measure, source and apply
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        # Read-only on purpose: the agent writes to the store through the
        # endpoint, never to this branch.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          cache-next: 'false'

      - name: Install dependencies
        run: npm ci

      - name: OpenCode Runner Setup
        uses: ./.github/actions/opencode-runner
        with:
          supabase-project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Measure a capped page
        id: plan
        env:
          MCP_CATALOG_AGENT_TOKEN: ${{ secrets.MCP_CATALOG_AGENT_TOKEN }}
          MCP_CATALOG_AGENT_URL: ${{ vars.MCP_CATALOG_AGENT_URL || 'https://royaraqamia.com' }}
          MCP_CATALOG_AGENT_CAP: ${{ github.event.inputs.cap || vars.MCP_CATALOG_AGENT_CAP || '3' }}
          MCP_CATALOG_AGENT_PUBLISH_CAP: ${{ vars.MCP_CATALOG_AGENT_PUBLISH_CAP || '3' }}
          MCP_CATALOG_AGENT_EGRESS_BUDGET: ${{ github.event.inputs.cap || vars.MCP_CATALOG_AGENT_CAP || '3' }}
        run: node scripts/mcp-catalog-agent.mjs plan

      - name: Source marks and copy — DeepSeek 4.1 Flash
        id: source
        timeout-minutes: 15
        uses: anomalyco/opencode/github@1c63fe9afeff4ead2623e9bbb2e2bc40e6205c0b # v1.18.21
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: 120000
        with:
          model: opencode-go/deepseek-v4.1-flash
          share: 'false'
          prompt: |
            You are the sourcing step of the MCP catalogue agent. A deterministic
            runner has already measured the rows; you do not decide whether a row
            may be published.

            Read /tmp/mcp-catalog-agent-plan.json. Every entry with
            `needsMark: true` and no `measuredMark` needs a brand mark. Every entry
            with `needsCopy: true` needs its Arabic copy. Entries with neither are
            not your work, and a row you cannot source is left out — the runner
            records it as waiting for a person.

            A mark may come from exactly three sources, in this order of
            preference, and the source you name must be the one you used:

            1. `logo_uri` — the RFC 9728 mark the probe measured. It is already in
               the entry as `measuredMark`; if that is null, this source has
               nothing, and you must not guess a URL.
            2. `brand` — the brand's own SVG on the brand's own domain. Open the
               brand's site and take the asset URL it serves; do not use a
               third-party logo site for this source.
            3. `simple_icons` — the official Simple Icons mark (CC0), as
               `https://cdn.simpleicons.org/<slug>` where `<slug>` is the Simple
               Icons slug. Never use a slug you have not confirmed exists. Add
               `"vendor": true` when the mark should ship with the site: the
               runner fetches the SVG, opens one batched pull request, and the
               row waits as `repo_pr_pending` until a person merges it.

            A mark is the real mark or nothing. Do not approximate a logo, do not
            build one from the name, and do not reuse a different product's mark.

            The copy is a transform, never an author. For each entry with
            `needsCopy`:

            - `titleOverride`: the registry's own title normalised to the brand
              without the vendor's descriptor (`Vercel MCP Server` → `Vercel`).
            - `nameAr`: that brand name in Arabic script.
            - `descriptionAr`: a faithful Arabic translation of the entry's
              `description`. Keep every claim the publisher made and add none.
              Never rewrite the English, and never write marketing.

            Your only deliverable is /tmp/mcp-catalog-agent-decisions.json, and it
            must be exactly this shape:

            {
              "marks": [
                { "registryName": "...", "mark": "https://...", "source": "brand" }
              ],
              "copies": [
                { "registryName": "...", "titleOverride": "...", "nameAr": "...", "descriptionAr": "..." }
              ]
            }

            Write the file with the Write tool, then stop. Do not modify the
            repository, do not run git, and do not call any API.

      - name: Apply what the checks allow
        id: apply
        env:
          MCP_CATALOG_AGENT_TOKEN: ${{ secrets.MCP_CATALOG_AGENT_TOKEN }}
          MCP_CATALOG_AGENT_URL: ${{ vars.MCP_CATALOG_AGENT_URL || 'https://royaraqamia.com' }}
          MCP_CATALOG_AGENT_ENABLED: ${{ vars.MCP_CATALOG_AGENT_ENABLED || 'false' }}
          # A scheduled run has no input, and the runner's own fallback is a dry
          # run: without this the cron would measure and write nothing while
          # reporting success. A dispatch keeps its own answer ("false" checked
          # off is a truthy string, so `||` leaves it alone).
          MCP_CATALOG_AGENT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/mcp-catalog-agent.mjs apply

      - name: Open the batched mark pull request
        # The one human step left in the loop: at most one pull request per run,
        # listing each row, its source URL and the mark. The rows wait as
        # `repo_pr_pending` until it merges.
        if: always() && steps.apply.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKS_BODY: /tmp/mcp-catalog-agent-marks.md
        run: |
          set -euo pipefail
          if [ ! -s "$MARKS_BODY" ]; then
            echo "No vendored marks this run."
            exit 0
          fi

          gh auth setup-git
          branch="mcp-catalog-marks-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add public/brand/mcp
          if git diff --cached --quiet; then
            echo "No new mark files to ship."
            exit 0
          fi
          git -c user.name='MCP catalogue agent' \
              -c user.email='actions@users.noreply.github.com' \
              commit -m "feat(mcp): add brand marks for the catalogue"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "feat(mcp): add brand marks for the catalogue" \
            --body-file "$MARKS_BODY"

      - name: Record withdrawals where a person can see them
        # A published row leaving the store is something a member can meet. One
        # tracking issue, deduped by title, never one issue per row (#1293).
        if: always() && steps.apply.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RESULT_PATH: /tmp/mcp-catalog-agent-result.json
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.RESULT_PATH)) {
              core.notice('No result file: the apply step wrote nothing, so there is nothing to record.');
              return;
            }
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            const withdrawals = result.withdrawals || [];
            if (withdrawals.length === 0) {
              core.notice('No withdrawal this run.');
              return;
            }

            const title = 'MCP catalogue agent: runs and withdrawals';
            const listing = withdrawals
              .map((row) => '- `' + row.registryName + '` — ' + (row.detail || 'check failed'))
              .join('\n');
            const body =
              'The catalogue agent withdrew ' + withdrawals.length + ' published row(s) because a later check failed:\n\n' +
              listing + '\n\n' +
              'The run summary names the class and the checks it measured.';

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Run [' + context.runId + '](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '):\n\n' + listing,
              });
              core.info('Commented on #' + existing.number);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info('Opened the withdrawal tracking issue.');
            }
