# The net under the Issue Implementer: every open `opencode/*` pull request is driven to
# green and squash-merged, however it was left.
#
# ADR 0120 makes the implementer the gate on its own pull request, and that stays the fast
# path: a round watches its pull request and merges inside the same run. What this workflow
# removes is the failure mode behind #996-#1000, where a round that could not finish left a
# pull request open and nothing ever looked at it again - the picker skips an issue an open
# pull request names, so a red pull request parked its issue for good.
#
# Two jobs, and they never overlap the implementer:
#
# - `sweep` runs every two hours, and does nothing while an implementer run is in flight:
#   during a run the implementer is the one watching its own pull request, so two writers
#   on one branch is exactly the race this workflow exists to avoid. Once the run is over -
#   or dead - the next sweep owns whatever it left open.
# - `land` is dispatched once per pull request, so `concurrency` can be per pull request:
#   a landing run is the only thing touching that branch.
#
# A landing run is one attempt: watch the checks, merge when green; if red, repair once on
# the branch (the conflict with `main` included, because a conflicted pull request gets no
# checks at all) and watch again. Still red, and the next sweep takes it again two hours
# later. After `MAX_ATTEMPTS` attempts the pull request is labelled `opencode:stuck` and
# left alone - a check that cannot pass needs a decision, not an unbounded agent - and
# removing the label puts it back in the queue.
#
# The repair pushes a commit, and a push made with `GITHUB_TOKEN` starts no workflow: the
# new head would never be measured, and every repair would look like a failure. So the push
# itself is authenticated with `AGENT_PUSH_TOKEN` (a fine-grained PAT with `Contents: Read
# and write` and nothing else), while every read, comment, label and merge stays on
# `GITHUB_TOKEN` - the PAT is only ever a push credential and is never written to the git
# config. When the secret is absent the run says so on the pull request instead of
# pretending the repair worked.
#
# Setup (repo secrets), shared with the other OpenCode workflows:
#   OPENCODE_API_KEY      - the agent that repairs a red landing
#   AGENT_PUSH_TOKEN      - pushes a repair commit that CI will actually run on
#   SUPABASE_* / VERCEL_* - the same tools the implementer gives its agent
#   E2E_TEST_*            - the specs that need a session

name: 'PR Landing'

on:
  schedule:
    # Every two hours. The old 30-minute sweep meant a stranded pull request was
    # retried up to 48 times a day, and every retry that found a red check started
    # an agent. Two hours keeps the worst-case wait reasonable while capping the
    # agent's daily attempts at 12. ADR 0133.
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to land. Empty sweeps every eligible open pull request.'
        type: string
        default: ''

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

# One landing run per pull request. The sweep has a group of its own, so a slow landing
# never blocks the next sweep from finding the other pull requests.
concurrency:
  group: pr-land-${{ github.event.inputs.pr || 'sweep' }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Find the pull requests to land
    if: github.event.inputs.pr == '' || github.event.inputs.pr == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch one landing run per open pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // The implementer lands its own pull request inside its round. While it is
            // running, this workflow stays out of the way; the sweep after it ends picks
            // up whatever the run left behind.
            const running = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'issue-implementer.yml',
              per_page: 10,
            });
            const inFlight = (running.data.workflow_runs || []).filter(
              (run) => run.status === 'in_progress' || run.status === 'queued'
            );
            if (inFlight.length > 0) {
              core.notice('An Issue Implementer run is in flight; it owns landing right now.');
              return;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const eligible = pulls.filter(
              (pr) =>
                pr.head.ref.startsWith('opencode/') &&
                pr.base.ref === 'main' &&
                !pr.draft &&
                !pr.labels.some((label) => label.name === 'opencode:stuck')
            );
            if (eligible.length === 0) {
              core.notice('No open opencode/ pull request needs landing.');
              return;
            }

            for (const pr of eligible.slice(0, 10)) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'pr-land.yml',
                ref: context.payload.repository.default_branch,
                inputs: { pr: String(pr.number) },
              });
              core.info('Dispatched a landing run for #' + pr.number + ': ' + pr.title);
            }

  land:
    name: Land pull request
    if: github.event.inputs.pr != '' && github.event.inputs.pr != null
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PR: ${{ github.event.inputs.pr }}
      # Everything `gh` does here - checkout, watch, comment, label, merge - stays on the
      # scoped token. The PAT below is a push credential and nothing else, so a leak of it
      # cannot comment, label or merge anything.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAS_PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN != '' }}
    steps:
      - name: Check this is a pull request we land
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.inputs.pr;
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(pr),
            });
            const stuck = data.labels.some((label) => label.name === 'opencode:stuck');
            if (data.state !== 'open' || stuck || !data.head.ref.startsWith('opencode/')) {
              core.notice(
                'Skipping #' + pr + ': state ' + data.state + ', stuck ' + stuck + ', head ' + data.head.ref
              );
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('skip', 'false');
            core.setOutput('head', data.head.ref);

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the model allowance
        # A repair is the optional part of landing: a green pull request still merges
        # without the agent. When the five-hour allowance is nearly spent, the repair
        # is deferred to the next sweep instead of spending the rest of the window on
        # it. Any error reads as "not soft", so a broken ledger never stops a merge.
        # The gate runs after the checkout because it is a local action. ADR 0133.
        if: steps.gate.outputs.skip != 'true'
        id: budget
        continue-on-error: true
        uses: ./.github/actions/agent-usage
        with:
          mode: gate
          workflow: PR Landing
          cap-5h-usd: '15'
          cap-weekly-usd: '40'
          cap-monthly-usd: '75'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ievboaylytxgtijconak.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Setup Build Environment
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          cache-next: 'false'

      - name: OpenCode Runner Setup
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/opencode-runner
        with:
          supabase-project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}

      # The same toolchain the implementer installs, because a repair is only as good as the
      # gate it can run: `check:visual` needs JDK 21 and the SDK, and the specs need Chromium.
      - name: Setup JDK 21
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Accept the SDK licences
        if: steps.gate.outputs.skip != 'true'
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Cache Gradle
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install the Playwright browser
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      # The implementer's repair step runs after the opencode action, which leaves the CLI on
      # PATH. This workflow has no such step, so it installs the same pinned CLI itself.
      - name: Install the OpenCode CLI
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm install --global opencode-ai@1.18.21
          opencode --version

      - name: Check out the pull request's branch
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # `Checkout` persists no credentials on purpose; `GH_TOKEN` is read by `gh`, not by
          # `git`, so the helper has to be configured before any git command needs it.
          gh auth setup-git
          gh pr checkout "$PR"

      - name: Watch the checks, then merge
        id: land
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -uo pipefail
          bash scripts/ci/land-pull-request.sh "$PR"

      - name: Repair the pull request — one attempt per run
        id: repair
        # One attempt, not a loop: the next attempt is the next sweep, two hours later, on
        # a runner that starts clean. A second red result inside the same run would only
        # spend the agent on the same tree twice.
        #
        # The sweep itself runs every two hours for the merge, but the repair is deferred
        # when it would start inside DeepSeek's double-price window: a green merge costs no
        # model, and the next off-peak sweep repairs the pull request at half the price.
        if: steps.gate.outputs.skip != 'true' && steps.land.outputs.status == 'red' && steps.budget.outputs.soft != 'true' && steps.budget.outputs.peak != 'true'
        timeout-minutes: 60
        env:
          AGENT_PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          TURNSTILE_SECRET_KEY: '1x0000000000000000000000000000000AA'
          NEXT_PUBLIC_WHATSAPP_PHONE: '963968478904'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ievboaylytxgtijconak.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_S6OJdmRtfmL_trKAY1ypqQ_WZYRjVK2'
          REASON: ${{ steps.land.outputs.reason }}
          MAX_ATTEMPTS: '2'
          OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: 750000
        run: |
          set -euo pipefail

          # The provider's own allowance is not a code defect and an agent cannot fix
          # it: spending 60 minutes failing the same way is how a limited window turns
          # into a dead day. The next sweep retries when the window has moved.
          if printf '%s' "$REASON" | grep -Eqi '429|too many requests|rate.?limit|budget|allowance|capacity|quota'; then
            gh pr comment "$PR" --body "A repair was skipped because the model allowance refused the work (${REASON}). The next landing pass retries it."
            echo "::warning title=The model allowance refused the run::Skipping the repair on #$PR this pass."
            exit 0
          fi

          attempts=$(gh pr view "$PR" --json comments --jq '
            [ .comments[] | select(.body | contains("<!-- pr-land-attempt")) ] | length')
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            gh label create opencode:stuck --color b60205 \
              --description 'A landing that has failed its attempts; a person decides' >/dev/null 2>&1 || true
            gh pr edit "$PR" --add-label opencode:stuck >/dev/null
            gh pr comment "$PR" --body "This pull request has failed $attempts landing attempts. It is labelled \`opencode:stuck\` and left alone: remove the label to put it back in the queue."
            echo "::warning title=Stuck::#$PR failed $attempts landing attempts."
            exit 0
          fi

          if [ "$HAS_PUSH_TOKEN" != 'true' ]; then
            echo "::warning title=AGENT_PUSH_TOKEN is missing::A repair cannot be measured without it."
            gh pr comment "$PR" --body "A repair is needed, but this repository has no \`AGENT_PUSH_TOKEN\` secret. A push made with \`GITHUB_TOKEN\` starts no workflow, so the repaired head would never be measured. Add a fine-grained PAT with \`Contents: Read and write\` as \`AGENT_PUSH_TOKEN\`."
            exit 0
          fi

          gh pr comment "$PR" --body "<!-- pr-land-attempt -->Landing attempt $((attempts + 1)): ${REASON}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin main
          if ! git merge --no-edit FETCH_HEAD >/dev/null; then
            echo "::notice title=The base moved::The conflict with main is part of this repair."
          fi

          cat > /tmp/repair-prompt.txt <<PROMPT
          You are the Issue Implementer on the landing run for pull request #$PR. It is still open because:

          <failing-checks>
          ${REASON}
          </failing-checks>

          If the working tree has an unresolved merge, resolve it first (load the resolving-merge-conflicts skill): a pull request that conflicts with main gets no checks at all, so the conflict stands between this branch and a measurement. Keep both intents; never resolve a conflict by deleting the other side's work.

          Then re-run the gate that failed in this working tree to see the failure for yourself, load the diagnosing-bugs skill if the cause is not obvious, and fix the cause. The workflow commits and pushes for you: do not run git commands and do not open a pull request.

          Never make a check pass by weakening it: no skipped or deleted test, no widened tolerance, no --no-verify, no .only, no commented assertion, no gate removed from a script. A check that is wrong for a reason you can state is reported, not deleted.

          Then run the gates the change reaches, scoped to your edit. Reply with one sentence naming what you fixed.
          PROMPT

          set +e
          opencode run --model opencode-go/deepseek-v4.1-flash "$(cat /tmp/repair-prompt.txt)"
          status=$?
          set -e

          # A conflict left unresolved would be staged as markers by the `git add -A` below.
          if git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)' >/dev/null 2>&1; then
            git merge --abort >/dev/null 2>&1 || true
            echo "The conflict with main was left unresolved; the next sweep takes it again."
            exit 0
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "The repair changed nothing; the next sweep takes it again."
            exit 0
          fi

          git add -A
          git commit -m "fix: repair the failing checks on #$PR"
          # The one push in this workflow that must start CI, so it carries the PAT in the
          # URL rather than through the credential helper: a `GITHUB_TOKEN` push starts no
          # workflow, and the new head would never be measured.
          git push "https://x-access-token:${AGENT_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${{ steps.gate.outputs.head }}"
          printf 'pushed=true\n' >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::warning title=Repair run failed::The repair changed files but exited $status; the checks will decide."
          fi

      - name: Record what the repair spent
        # Best-effort and non-blocking. ADR 0133.
        if: always() && steps.repair.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/agent-usage
        with:
          mode: record
          workflow: PR Landing
          round: 'repair'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ievboaylytxgtijconak.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Watch the repaired pull request, then merge
        id: recheck
        if: steps.repair.outputs.pushed == 'true'
        run: |
          set -uo pipefail
          bash scripts/ci/land-pull-request.sh "$PR"

      - name: Report what the run left
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          STATUS: ${{ steps.recheck.outputs.status || steps.land.outputs.status }}
          REASON: ${{ steps.recheck.outputs.reason || steps.land.outputs.reason }}
        run: |
          set -uo pipefail
          echo "status=${STATUS:-unknown} reason=${REASON:-none}"
          if [ "${STATUS:-}" != 'merged' ]; then
            echo "::warning title=Still open::#$PR is ${STATUS:-unknown}: ${REASON:-see the pull request}"
          fi
