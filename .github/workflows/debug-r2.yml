name: 'Debug R2 listing'
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          echo '--- buckets ---'
          aws s3api list-buckets --endpoint-url "$R2_ENDPOINT" --query 'Buckets[].Name' --output text || true
          echo '--- bucket root ---'
          aws s3 ls "s3://$R2_BACKUP_BUCKET" --endpoint-url "$R2_ENDPOINT" || true
          echo '--- database prefix ---'
          aws s3 ls "s3://$R2_BACKUP_BUCKET/database/" --endpoint-url "$R2_ENDPOINT" || true
