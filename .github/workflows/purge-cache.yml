# Purge Cloudflare's HTML cache when a deploy lands.
#
# The cache rule from ADR-0175 honours the origin's `s-maxage`, and Next serves a
# prerendered page with `s-maxage=31536000` - one year. That is the right lifetime
# for bytes that cannot change under a URL, and the wrong one for HTML that a
# deploy replaces: without this, a corrected page would stay invisible to visitors
# until someone purged by hand (ADR-0177).
#
# The wait is what makes it correct rather than hopeful: a push to `main` is not a
# deploy yet, and purging before Render swaps the container would simply refill the
# cache with the old build. `sw-version.js` carries `<semver>-<7-char-sha>` and is
# served `no-store`, so polling it is how this job learns the new build is the one
# answering requests.
#
# `paths-ignore` mirrors the Render build filter (`render.yaml`): a push that
# cannot produce a deploy does not start a job that would wait for one.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN - a token with **Zone.Cache Purge** on the zone. Nothing
#                          else; it cannot read or change any other setting.
#
# Variables:
#   CLOUDFLARE_ZONE_ID - the zone to purge (royaraqamia.com).
#   SITE_BASE_URL      - optional, defaults to https://royaraqamia.com

name: 'Purge Edge Cache'

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
      - 'android/**'
      - 'e2e/**'
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purge-edge-cache
  cancel-in-progress: false

env:
  BASE_URL: ${{ vars.SITE_BASE_URL || 'https://royaraqamia.com' }}

jobs:
  purge:
    name: Wait for the deploy, then purge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      live: ${{ steps.wait.outputs.live }}
    steps:
      - name: Wait for the new build to answer
        id: wait
        run: |
          target="${GITHUB_SHA:0:7}"
          echo "waiting for $target to answer at $BASE_URL"
          for attempt in $(seq 1 60); do
            live="$(curl -fsS --max-time 15 "$BASE_URL/sw-version.js?attempt=$attempt" || true)"
            if printf '%s' "$live" | grep -q "$target"; then
              echo "deploy $target is live"
              echo "live=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "live=false" >> "$GITHUB_OUTPUT"
          echo "::warning::deploy $target did not answer within 20 minutes"

      # Always: a failed deploy leaves the previous build serving, and a purge of
      # that is cheaper than keeping a stale page until the next push.
      - name: Purge the zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          response="$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')"
          echo "$response"
          printf '%s' "$response" | grep -q '"success":true'

      - name: The deploy never answered
        if: steps.wait.outputs.live != 'true'
        run: |
          echo "Render did not serve $GITHUB_SHA within 20 minutes; check the deploy, then re-run this job." >&2
          exit 1
