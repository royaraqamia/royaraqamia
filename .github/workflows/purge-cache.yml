# Re-reads the discovery documents, then purges Cloudflare's zone.
#
# This is the last step of `Publish origin image` (called as a reusable
# workflow, ADR-0209 amendment) and stays dispatchable on its own, which is the
# recovery for a purge that failed after a build had already landed. The origin
# deploys on the VPS (`deploy/vps/deploy.sh`, ADR-0221), but the edge still has
# to be purged after one, and the discovery documents still have to name the
# public origin (ADR-0177, ADR-0178). A prerendered page carries a year of
# `s-maxage`, so without this a deploy leaves the old HTML in place.
#
# Order when run by hand: `gh workflow run 'Publish origin image'` does the
# build, the deploy and this. Dispatch this alone only to recover a failed
# purge.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN   - Zone.Cache Purge only
# Variables:
#   CLOUDFLARE_ZONE_ID     - royaraqamia.com
#   SITE_BASE_URL          - optional, defaults to https://royaraqamia.com

name: 'Purge the edge'

on:
  workflow_call:
    inputs:
      reason:
        description: 'Why the purge is being run now'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the purge is being run now'
        required: false

permissions:
  contents: read

concurrency:
  group: purge-cache
  cancel-in-progress: false

env:
  BASE_URL: ${{ vars.SITE_BASE_URL || 'https://royaraqamia.com' }}

jobs:
  purge:
    name: Re-read the discovery documents, then purge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Only main purges
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::the zone is purged from main only; dispatch this workflow on main."
            exit 1
          fi

      - name: Discovery documents name the public origin
        run: |
          base="${BASE_URL%/}"
          issuer="$(curl -fsS --max-time 15 "$base/.well-known/oauth-authorization-server" | jq -r .issuer)"
          resource="$(curl -fsS --max-time 15 "$base/.well-known/oauth-protected-resource" | jq -r .resource)"
          echo "issuer=$issuer resource=$resource"
          test "$issuer" = "$base"
          test "$resource" = "$base/mcp"

      - name: Purge the edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          response="$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')"
          echo "$response"
          printf '%s' "$response" | grep -q '"success":true'

      - name: Summary
        run: |
          {
            echo "### Zone purged"
            echo "Trigger: ${{ github.event_name }}"
            echo "Reason: ${{ inputs.reason || github.event.inputs.reason || 'no reason given' }}"
          } >> "$GITHUB_STEP_SUMMARY"
