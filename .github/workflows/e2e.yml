name: 'E2E Tests'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight — verify E2E credentials are configured
        id: creds
        env:
          PRESENT: ${{ secrets.E2E_TEST_EMAIL != '' && secrets.E2E_TEST_PASSWORD != '' }}
        run: |
          if [ "$PRESENT" != "true" ]; then
            echo "::warning::Secrets E2E_TEST_EMAIL / E2E_TEST_PASSWORD are not configured on this repository — skipping the E2E suite."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Build Environment
        if: steps.creds.outputs.enabled == 'true'
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.creds.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.creds.outputs.enabled == 'true'
        run: npm run test:e2e
        env:
          CI: 'true'
          NEXT_PUBLIC_WHATSAPP_PHONE: '963968478904'
          NEXT_PUBLIC_SUPABASE_URL: 'https://ievboaylytxgtijconak.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_S6OJdmRtfmL_trKAY1ypqQ_WZYRjVK2'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # Optional live native-push round-trip (e2e/push.spec.ts). Skipped
          # unless PUSH_E2E is exactly '1'; enabling requires these repo
          # secrets: PUSH_E2E, VAPID_SUBJECT, NEXT_PUBLIC_VAPID_PUBLIC_KEY,
          # VAPID_PRIVATE_KEY.
          PUSH_E2E: ${{ secrets.PUSH_E2E }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      - name: Upload Playwright report
        if: failure() && steps.creds.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
