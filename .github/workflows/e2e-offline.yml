name: 'E2E: Offline'

# The offline suite is the only automated check that a write survives the network
# and reaches the server afterwards, and that a visited public route paints from
# the service-worker cache with the radio off (spec: docs/specs/offline-first.md).
# It needs a production build — the worker is not registered in development — so
# it runs on the surfaces that can break offline behaviour rather than on every
# pull request, and Playwright's `webServer` performs the build because GitHub
# sets CI.
#
# Turnstile is deliberately left unconfigured here: `backend/config/turnstile.ts`
# skips verification when `TURNSTILE_SECRET_KEY` is absent, which is what lets the
# specs sign in with a dummy token against this throwaway server. Setting the
# secret turns this job red — do not "fix" it that way.
#
# The owned-data specs need the Playwright test account that
# `e2e/setup-test-user.ts` creates — both halves of it: the `auth.users` row and
# the `public.users` profile the schema's foreign keys point at. Its credentials
# live in the `E2E_TEST_EMAIL` and `E2E_TEST_PASSWORD` secrets. Without them those
# specs stay skipped rather than failing, so the check is honest about what it
# covered. The job runs that script before the suite, which also keeps the account
# on Pro: its owned-item caps are the easy way to turn a run into a false red
# (ADR-0075, and the "Prepare the test account" step below).
#
# Every offline spec is wired in except `e2e/lead-offline.spec.ts`, which is left
# out on purpose: it writes a Project Request the suite has no way to remove, and
# the Supabase project here is the live one.
#
# `--workers=1` is not a workaround for flakiness, it is the shape of this suite:
# every test signs in as the same account, and the login endpoint allows five
# attempts per email per minute (`backend/services/auth/auth-service.ts`). Serial
# execution alone does not stay under that ceiling — the first five finish inside
# thirty seconds — so every sign-in goes through `e2e/sign-in.ts`, which paces the
# attempts and waits out the window when one is refused. Removing that (or the
# serial flag) brings back the 400 that reads like a broken product (#386).
#
# Background Sync itself is not what this job proves: Chromium gives no way to
# fire a `sync` event on demand, so the drain is unit-tested (its identity rules,
# the worker's listener) and what runs here is the fallback — the flush a page
# does while it is open. See `docs/specs/offline-first.md` for that split.
#
# NOTE: a path-filtered workflow reports no check when nothing matches, so this
# must not be made a required status check on `main`.

on:
  pull_request:
    paths:
      - 'public/sw.js'
      - 'public/sw-routing.js'
      - 'scripts/generate-sw-precache.mjs'
      - 'frontend/shared/local-store/**'
      - 'frontend/shared/persistent-storage.ts'
      - 'frontend/state/**'
      - 'frontend/api/spendtrack/**'
      - 'frontend/api/blogpress/**'
      - 'frontend/api/habitflow/**'
      - 'frontend/api/leads/**'
      - 'frontend/api/quran/**'
      - 'frontend/api/sync-products.ts'
      - 'frontend/api/sw-outbox.ts'
      - 'frontend/api/sync-flush.ts'
      - 'frontend/api/sync-flush-entry.ts'
      - 'frontend/shared/local-store/drain-entry.ts'
      - 'public/sync-flush.html'
      - 'scripts/build-sync-flush.mjs'
      - 'backend/controllers/session.ts'
      - 'app/auth/api/session/**'
      - 'scripts/build-sw-outbox.mjs'
      - 'frontend/ui/shared/lazy-chunk.ts'
      - 'frontend/ui/linksnap/**'
      - 'app/blogpress/**'
      - 'app/habitflow/**'
      - 'app/spendtrack/**'
      - 'app/linksnap/**'
      - 'frontend/ui/spendtrack/**'
      - 'frontend/ui/habitflow/**'
      - 'frontend/ui/blogpress/**'
      - 'e2e/setup-test-user.ts'
      - 'e2e/sign-in.ts'
      - 'e2e/worker-control.ts'
      - 'e2e/public-offline.spec.ts'
      - 'e2e/responsive-offline.spec.ts'
      - 'e2e/spendtrack-offline.spec.ts'
      - 'e2e/habitflow-sync-resume.spec.ts'
      - 'e2e/product-offline-render.spec.ts'
      - 'e2e/sync-flush.spec.ts'
      - 'e2e/sync-chaos.spec.ts'
      - 'e2e/linksnap-offline.spec.ts'
      - 'e2e/blogpress-offline.spec.ts'
      - 'e2e/quran-sync.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Writes survive and resume
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      NEXT_PUBLIC_WHATSAPP_PHONE: '963968478904'
      NEXT_PUBLIC_SUPABASE_URL: 'https://ievboaylytxgtijconak.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_S6OJdmRtfmL_trKAY1ypqQ_WZYRjVK2'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The suite writes its fixtures on one shared account, so that account has
      # to start with headroom: it is put on Pro here, because the free
      # owned-item caps (5 habits, 10 links, 5 drafts) are smaller than what a
      # handful of runs leaves behind, and a capped account answers every
      # creating spec with 402 before it can even clean up after itself.
      # Idempotent, and refreshed every run. `--reset` is deliberately not
      # passed: two branches' offline jobs can run at once against this account,
      # and a purge would delete rows the other run is asserting on.
      - name: Prepare the test account
        if: ${{ env.E2E_TEST_EMAIL != '' }}
        run: node e2e/setup-test-user.ts

      # One invocation, so one production build, and serial so the specs do not
      # rate-limit each other's sign-in. The public spec needs no account; the
      # owned-data flags are set only when the account is configured.
      #
      # The four `responsive-*` projects are the offline breakpoint matrix
      # (#396): each is one of 320 / 375 / 428 / 768 px, and their
      # `testMatch: /responsive/` is the mirror of `existing-tests`' ignore, so
      # `responsive-offline.spec.ts` runs once per width and nothing else runs
      # there. All of them in this single invocation keeps the matrix at one
      # production build.
      - name: Offline suite
        run: >
          npx playwright test
          e2e/public-offline.spec.ts
          e2e/responsive-offline.spec.ts
          e2e/spendtrack-offline.spec.ts
          e2e/habitflow-sync-resume.spec.ts
          e2e/linksnap-offline.spec.ts
          e2e/blogpress-offline.spec.ts
          e2e/product-offline-render.spec.ts
          e2e/quran-sync.spec.ts
          e2e/sync-chaos.spec.ts
          e2e/sync-flush.spec.ts
          --project=existing-tests
          --project=responsive-mobile-small
          --project=responsive-mobile-medium
          --project=responsive-mobile-large
          --project=responsive-tablet
          --workers=1
        env:
          PUBLIC_OFFLINE_E2E: '1'
          SPENDTRACK_OFFLINE_E2E: ${{ secrets.E2E_TEST_EMAIL != '' && '1' || '0' }}
          HABITFLOW_SYNC_E2E: ${{ secrets.E2E_TEST_EMAIL != '' && '1' || '0' }}
          LINKSNAP_OFFLINE_E2E: ${{ secrets.E2E_TEST_EMAIL != '' && '1' || '0' }}
          BLOGPRESS_OFFLINE_E2E: ${{ secrets.E2E_TEST_EMAIL != '' && '1' || '0' }}
          PRODUCT_OFFLINE_E2E: ${{ secrets.E2E_TEST_EMAIL != '' && '1' || '0' }}
          SYNC_FLUSH_E2E: ${{ secrets.E2E_TEST_EMAIL != '' && '1' || '0' }}
          SYNC_CHAOS_E2E: ${{ secrets.E2E_TEST_EMAIL != '' && '1' || '0' }}
          QURAN_SYNC_E2E: ${{ secrets.E2E_TEST_EMAIL != '' && '1' || '0' }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-offline-failure
          path: node_modules/.playwright/test-results/
          retention-days: 7
