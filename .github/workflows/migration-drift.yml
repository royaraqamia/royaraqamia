# Keeps `supabase/migrations/` and the linked project's recorded migration
# history pointing at the same versions, and applies the ones a merge left
# behind.
#
# Two writers keep those lists and nothing compared them: a pull request adds a
# migration file and `supabase db push` applies it by hand, while the autonomous
# issue pipeline applies the same SQL to the project through the Supabase MCP
# `apply_migration` tool. Either direction of disagreement is a production
# incident waiting to be noticed:
#
#   - a file the project has no version for -> deployed code expects schema that
#     production does not have;
#   - a recorded version the repo has no file for -> schema or a policy nobody
#     reviewed, with no migration file to roll it back.
#
# On main the order is: plan, vet, apply, verify. `scripts/check-migration-safety.mjs`
# refuses to apply anything destructive unattended (see its header), so those
# migrations stay pending and the verify step reports them until a person applies
# them by hand. The apply itself uses the same credentials the plan already used
# — the access token, plus SUPABASE_DB_PASSWORD when the repository has one: the
# CLI can mint its own login role for a linked project, which is what "Finished
# supabase link" plus a dry run that connects proves.
#
# A pull-request run only checks, and is relaxed about being ahead: the migration
# it adds is applied by main after the merge.
#
# Deliberately not a required check yet: it depends on the Management API and on
# repository secrets. See docs/supabase.md ("Drift check") and ADR 0040/0041.

name: 'Migration Drift'

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-migration-drift.mjs'
      - 'scripts/check-migration-safety.mjs'
      - 'scripts/__tests__/migration-*.test.mjs'
      - '.github/workflows/migration-drift.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-migration-drift.mjs'
      - 'scripts/check-migration-safety.mjs'
      - '.github/workflows/migration-drift.yml'
  schedule:
    # 05:23 UTC, an hour before the health heartbeat, so a drift that arrives
    # with an overnight implementer run is visible the same morning. The schedule
    # never applies anything; it reports.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      project-ref:
        description: 'Compare against this project ref instead of SUPABASE_PROJECT_REF (a drill, or a non-production project)'
        required: false
      apply:
        description: 'Apply the pending migrations too (needs SUPABASE_DB_PASSWORD)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: migration-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  APPLY_REQUESTED: ${{ github.event_name == 'push' || inputs.apply == true }}

jobs:
  drift:
    name: Repo migrations match the linked project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          install-web-deps: 'false'
          cache-next: 'false'

      - name: Setup Supabase CLI
        if: github.event_name != 'pull_request'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.120.0

      # The plan a merge would apply, straight from the tool that would apply it.
      # Diagnostic as well as informational: it is the only place that exercises
      # the linked working copy without a database password, so it reports rather
      # than gates.
      - name: Plan the pending migrations
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project-ref || secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" \
            && supabase db push --linked --dry-run \
            || echo "::warning::The plan step could not run; the verify step below is still the verdict."

      - name: Vet the pending migrations
        id: guard
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project-ref || secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-migration-safety.mjs

      - name: Apply them
        if: github.event_name != 'pull_request' && env.APPLY_REQUESTED == 'true' && steps.guard.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ inputs.project-ref || secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --yes

      - name: Compare supabase/migrations with the linked project
        id: drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project-ref || secrets.SUPABASE_PROJECT_REF }}
          # A pull request is allowed to be ahead: main applies what it adds.
          MIGRATION_DRIFT_STRICT: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: node scripts/check-migration-drift.mjs

      # A pull request comments through its own check, so only the runs that have
      # no pull request to comment on get an issue. Same single-alert channel as
      # .github/workflows/issue-automation-health.yml. The alert path can be
      # drilled without touching production: dispatch with a bogus `project-ref`
      # to open it, then dispatch again with none to close it.
      - name: Reconcile the drift alert issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const LABEL = 'opencode:alert';
            const TITLE = 'Migration drift: supabase/migrations and the linked project disagree';
            const healthy = process.env.DRIFT_OUTCOME === 'success';
            const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === TITLE);

            if (healthy) {
              if (!existing) {
                core.info('In sync; no alert to raise.');
                return;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: 'Recovered: the drift check found the two sides in sync again (' + runUrl + ').',
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info('Closed drift alert #' + existing.number + '.');
              return;
            }

            const body = [
              'The migration job failed on `' + context.eventName + '`: `supabase/migrations` and the linked',
              'project do not agree, a pending migration was refused as unsafe to apply unattended, or the',
              'project could not be read at all. The run log says which: ' + runUrl,
              '',
              'When it is a disagreement, one of the two lists is ahead: a merged migration that was never',
              "applied (add SUPABASE_DB_PASSWORD and it applies itself), or schema applied out of band",
              'through the Supabase MCP `apply_migration` tool that never landed as a merged file.',
              '',
              'See `docs/supabase.md` ("Drift check") and ADR 0040/0041.',
              '',
              '_Maintained by `.github/workflows/migration-drift.yml`._',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info('Updated drift alert #' + existing.number + '.');
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'b60205',
                description: 'An autonomous pipeline needs a human',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            const created = await github.rest.issues.create({
              owner, repo, title: TITLE, body, labels: [LABEL],
            });
            core.info('Opened drift alert #' + created.data.number + '.');
