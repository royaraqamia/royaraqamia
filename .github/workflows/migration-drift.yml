# Keeps `supabase/migrations/` and the linked project's recorded migration
# history pointing at the same versions, and reports the ones nobody applied.
#
# Two writers keep those lists and nothing compared them: a pull request adds a
# migration file and the Supabase GitHub integration applies it on the push to
# main, while the autonomous issue pipeline applies the same SQL to the project
# through the Supabase MCP `apply_migration` tool. Either direction of
# disagreement is a production incident waiting to be noticed:
#
#   - a file the project has no version for -> deployed code expects schema that
#     production does not have;
#   - a recorded version the repo has no file for -> schema or a policy nobody
#     reviewed, with no migration file to roll it back.
#
# On main the order is: plan, vet, wait, verify. The integration is the only applier
# on a push: this workflow used to run `supabase db push --linked --yes` there
# too, and the two appliers raced on `schema_migrations_pkey` (23505) — the
# Supabase Preview check on 97f39d4 died that way against 20261225000000.
# `scripts/check-migration-safety.mjs` still vets the pending files, and the
# verify step reports anything the integration left pending. Applying from here
# is now a manual recovery (`workflow_dispatch` with `apply: true`), using the
# same credentials the plan already used — the access token, plus
# SUPABASE_DB_PASSWORD when the repository has one: the CLI can mint its own
# login role for a linked project, which is what "Finished supabase link" plus a
# dry run that connects proves.
#
# `scripts/check-migration-grants.mjs` runs on the pull request too. Supabase
# stopped granting the Data API roles on new objects in `public` on 2026-10-30, so
# a migration that forgets its grant applies cleanly and then answers 42501; the
# pull request is where that is cheap to catch, without the management API.
#
# A pull-request run only checks, and is relaxed about being ahead: the migration
# it adds is applied by the integration after the merge.
#
# Deliberately not a required check yet: it depends on the Management API and on
# repository secrets. See docs/supabase.md ("Drift check") and ADR 0040/0041.

name: 'Migration Drift'

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-migration-drift.mjs'
      - 'scripts/check-migration-safety.mjs'
      - 'scripts/check-migration-grants.mjs'
      - 'scripts/__tests__/migration-*.test.mjs'
      - '.github/workflows/migration-drift.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-migration-drift.mjs'
      - 'scripts/check-migration-safety.mjs'
      - 'scripts/check-migration-grants.mjs'
      - '.github/workflows/migration-drift.yml'
  schedule:
    # 05:23 UTC, an hour before the health heartbeat, so a drift that arrives
    # with an overnight implementer run is visible the same morning. The schedule
    # never applies anything; it reports.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      project-ref:
        description: 'Compare against this project ref instead of SUPABASE_PROJECT_REF (a drill, or a non-production project)'
        required: false
      apply:
        description: 'Apply pending migrations by hand as recovery (the integration applies them on main)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  issues: write

concurrency:
  group: migration-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # The Supabase integration applies merged migrations on push. Only an explicit
  # dispatch may apply from here, so the two never write the history at once.
  APPLY_REQUESTED: ${{ inputs.apply == true }}

jobs:
  drift:
    name: Repo migrations match the linked project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The grants step below diffs the pull request against origin/main.
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          install-web-deps: 'false'
          cache-next: 'false'

      # Runs on the pull request as well: a migration that creates a public
      # object without a grant applies cleanly and then answers 42501, and the
      # pull request is where that is cheap to catch. No credentials needed.
      - name: Vet grants on the migrations in this change
        run: node scripts/check-migration-grants.mjs

      - name: Setup Supabase CLI
        if: github.event_name != 'pull_request'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 2.120.0

      # The plan a merge would apply, straight from the tool that would apply it.
      # Diagnostic as well as informational: it is the only place that exercises
      # the linked working copy without a database password, so it reports rather
      # than gates.
      - name: Plan the pending migrations
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project-ref || secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" \
            && supabase db push --linked --dry-run \
            || echo "::warning::The plan step could not run; the verify step below is still the verdict."

      - name: Vet the pending migrations
        id: guard
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project-ref || secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/check-migration-safety.mjs

      # The integration is the applier on push. Reading the history before it has
      # written its version would report a migration that is merely on its way,
      # so wait for its check first. A missing or failed check is left to the
      # strict verify below, which opens the alert rather than applying by hand.
      - name: Wait for the Supabase integration on main
        id: supabase_integration
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deadline = Date.now() + 3 * 60 * 1000;
            let conclusion = null;
            while (conclusion === null && Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                check_name: 'Supabase Preview',
                per_page: 100,
              });
              const check = data.check_runs[0];
              if (check?.status === 'completed') conclusion = check.conclusion;
              else await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            core.info(`Supabase Preview: ${conclusion ?? 'did not finish in time'}`);
            core.setOutput('conclusion', conclusion ?? 'unknown');

      - name: Apply them
        if: github.event_name != 'pull_request' && env.APPLY_REQUESTED == 'true' && steps.guard.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ inputs.project-ref || secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --yes

      - name: Compare supabase/migrations with the linked project
        id: drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project-ref || secrets.SUPABASE_PROJECT_REF }}
          # A pull request is allowed to be ahead: the integration applies what it adds.
          MIGRATION_DRIFT_STRICT: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: node scripts/check-migration-drift.mjs

      # A pull request comments through its own check, so only the runs that have
      # no pull request to comment on get an issue. Same single-alert channel as
      # .github/workflows/issue-automation-health.yml. The alert path can be
      # drilled without touching production: dispatch with a bogus `project-ref`
      # to open it, then dispatch again with none to close it.
      - name: Reconcile the drift alert issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const LABEL = 'opencode:alert';
            const TITLE = 'Migration drift: supabase/migrations and the linked project disagree';
            const healthy = process.env.DRIFT_OUTCOME === 'success';
            const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === TITLE);

            if (healthy) {
              if (!existing) {
                core.info('In sync; no alert to raise.');
                return;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: 'Recovered: the drift check found the two sides in sync again (' + runUrl + ').',
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info('Closed drift alert #' + existing.number + '.');
              return;
            }

            const body = [
              'The migration job failed on `' + context.eventName + '`: `supabase/migrations` and the linked',
              'project do not agree, a pending migration was refused as unsafe to apply unattended, or the',
              'project could not be read at all. The run log says which: ' + runUrl,
              '',
              'When it is a disagreement, one of the two lists is ahead: a merged migration that was never',
              "applied (add SUPABASE_DB_PASSWORD and it applies itself), or schema applied out of band",
              'through the Supabase MCP `apply_migration` tool that never landed as a merged file.',
              '',
              'See `docs/supabase.md` ("Drift check") and ADR 0040/0041.',
              '',
              '_Maintained by `.github/workflows/migration-drift.yml`._',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info('Updated drift alert #' + existing.number + '.');
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'b60205',
                description: 'An autonomous pipeline needs a human',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }
            const created = await github.rest.issues.create({
              owner, repo, title: TITLE, body, labels: [LABEL],
            });
            core.info('Opened drift alert #' + created.data.number + '.');
