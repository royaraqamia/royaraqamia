name: 'Prune Deployments'

# Vercel Hobby counts Deployment Storage and Functions Storage as sums over
# *all retained deployments* of the project, 10 GB each, with no overage and no
# automatic retention. It also caps *deployment creation* at roughly 100 per day,
# which this repository hit on 2026-10-20 (91 created by mid-afternoon). Both
# problems had the same cause: every branch push became a preview deployment on
# top of one production deployment per merge and per release commit.
#
# `vercel.json` now sets `git.deploymentEnabled` to `main` only (`"**": false`; a
# bare `"*"` stops at `/` and missed every `type/name` branch), so pull-request
# branches no longer consume the daily cap or the storage meters. That leaves
# ~30 deployments/day (merges plus release commits), which this job keeps flat at
# `keep` deployments instead of sawtoothing towards the cap.
#
# This job deletes everything except the newest `keep` deployments, always
# preserving Vercel's rollback candidates and the current production deployment.
# It runs daily rather than weekly because the meters grow continuously: pruning
# daily keeps them flat instead of climbing between runs. It does not reduce the
# deployment *rate*; `git.deploymentEnabled` does that (see
# scripts/prune-deployments.mjs for why the alternative — skipping the
# `[skip ci]` release commit — was not taken).
#
# Run the workflow manually with dry_run first if you want to see the list.

on:
  schedule:
    # Daily, off-peak (03:41 UTC).
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting anything'
        type: boolean
        default: true
      keep:
        description: 'How many of the newest deployments to keep'
        type: string
        default: '25'

concurrency:
  group: prune-deployments
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: Prune deployments
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          install-web-deps: 'false'
          cache-next: 'false'

      - name: Prune
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # A scheduled run prunes for real; a manual run defaults to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          KEEP: ${{ inputs.keep || '25' }}
        run: |
          set -euo pipefail

          # Six hours, not a day: the previous gate protected a full day of
          # deployments, which at this repository's churn was the whole retained
          # set, so `keep` could never bind and storage stayed near the cap.
          args=(--keep="${KEEP}" --min-age-days=0.25)
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi

          node scripts/prune-deployments.mjs "${args[@]}"
