name: 'Shell Tests'

# The shell's update decision, and the download it verifies before handing to the
# installer, are JVM tests (`android/app/src/test`) — not web tests. They need the
# Android Gradle plugin and a JDK 21, which is why they are a job of their own
# rather than part of Unit Tests.
#
# ADR-0043 and ADR-0044 both lean on them: the arithmetic that decides what a user
# is told about an update, and the check that decides what may be installed. Both
# found real defects while they were being written (a `renameTo` that cannot
# replace a file on every platform, a truncation test that did not truncate), so a
# change to the shell runs them rather than trusting whoever ran them locally.
#
# Path-filtered to the native side and the scripts that feed it: a web-only pull
# request has no reason to spend ten minutes on a Gradle build.

on:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'shared/contracts/**'
      - 'shared/tokens/**'
      - 'scripts/android-publish.mjs'
      - 'scripts/android-release.mjs'
      - 'scripts/android-shell-version.mjs'
      - 'scripts/android.mjs'
      - 'scripts/generate-contracts.mjs'
      - 'scripts/generate-tokens.mjs'
      - 'scripts/__tests__/android-*.test.mjs'
      - 'scripts/__tests__/generate-contracts.test.mjs'
      - 'scripts/__tests__/generate-tokens.test.mjs'
      - '.github/workflows/shell-tests.yml'
      - '.github/actions/setup-environment/action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-tests:
    name: The shell's JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment
        with:
          node-version: '22'
          cache-next: 'false'

      # `scripts/android.mjs` looks for the JDK itself and refuses anything but 21,
      # because AGP 8.13 does not run on newer ones. Setting JAVA_HOME is how it
      # finds this one.
      - name: Setup JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Accept the SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Robolectric resolves its Android runtime (`android-all-instrumented`) from
      # Maven Central *inside the test JVM*, at test-class setup — where Gradle
      # neither retries nor verifies it. A slow or rate-limited fetch therefore
      # fails every Robolectric class at once (`MavenArtifactFetcher` throwing
      # `IOException`) while the rest of the JVM suite passes: that is what
      # failed #1080's run, 16 of 501 tests, all `sdk = [34]`. The Gradle cache
      # above does not cover it, so each run paid that download again.
      #
      # The key is the file that names the Robolectric version, because that
      # version is what names the artifact; a bump re-downloads. A cache cannot
      # be updated once written (`post-if: success()` means only a green run
      # saves one), so a surface that adds a new `@Config(sdk = …)` downloads
      # that jar on every run until this key moves — extend the hash of the
      # test sources when one does.
      - name: Cache the Robolectric runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/variables.gradle') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Run the shell's JVM tests
        run: npm run android:test
