name: 'One-off: legacy APK assets'

# This workflow exists for one run and is deleted afterwards (ADR-0046). It does the
# three things the release workflow cannot: publish the two historical APKs under the
# current naming, rename the 1.0.3 asset, and retire the old `shell` release. It has
# to run in CI because GitHub's asset CDN is not reachable from every machine — the
# upload has to happen where the download can be verified.
#
# The order is the safety story:
#
#   1. download the historical bytes and verify them against the hashes they were
#      published under — nothing else in this run is meaningful if these are wrong
#   2. publish `royaraqamia-1.0.1.apk` / `royaraqamia-1.0.2.apk` as their own releases
#   3. upload `royaraqamia-1.0.3.apk` beside the old-named asset
#   4. download all three back and hash them, which is what a device will do
#   5. point the manifest at the renamed asset (its sha256 must not move)
#   6. only then: remove the old asset and delete the retired release, whose tag the
#      manifest no longer names — deleting it earlier would 404 every device that had
#      not yet updated, because the URL contains the tag.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Download and verify only; change nothing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  migrate:
    name: Migrate the legacy assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the historical assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p legacy
          gh release download android-1.0.3 -p royaraqamia-shell-1.0.3.apk -D legacy
          gh release download shell -p royaraqamia-shell-20002.apk -D legacy
          gh release download shell -p royaraqamia-shell.apk -D legacy
          ls -l legacy

      - name: Verify them against the hashes they were published under
        run: |
          set -euo pipefail
          check() { # <file> <bytes> <sha256>
            size=$(stat -c%s "$1")
            sha=$(sha256sum "$1" | cut -d' ' -f1)
            echo "$1  $size bytes  $sha"
            if [ "$size" != "$2" ] || [ "$sha" != "$3" ]; then
              echo "::error title=Unexpected bytes::$1 is not the file that was published"
              exit 1
            fi
          }
          check legacy/royaraqamia-shell-1.0.3.apk   7447105 78fe6c833d07bb8512d0bfc468739cd086eb2de52fe7ccd08a68e50679edafad
          check legacy/royaraqamia-shell-20002.apk   7447121 ec821645e00ecbf58f5ca6b8bc80d1b6a6e600e79cddf866adc83a4b9f0e3bfb
          check legacy/royaraqamia-shell.apk         7446805 83287d303d9cd6cd1b228e13fbef100522ea46a1181ee91ec814ec43469f8e75

      - name: Publish the historical versions under the current naming
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="Historical build, re-published under the naming ADR-0046 introduced. The app follows https://royaraqamia.com/android/latest.json."

          cp legacy/royaraqamia-shell.apk royaraqamia-1.0.1.apk
          gh release create android-1.0.1 royaraqamia-1.0.1.apk \
            --title android-1.0.1 --latest=false --target main \
            --notes "Android shell 1.0.1 — versionCode 20001. $body"

          cp legacy/royaraqamia-shell-20002.apk royaraqamia-1.0.2.apk
          gh release create android-1.0.2 royaraqamia-1.0.2.apk \
            --title android-1.0.2 --latest=false --target main \
            --notes "Android shell 1.0.2 — versionCode 20002. $body"

      - name: Rename the 1.0.3 asset
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp legacy/royaraqamia-shell-1.0.3.apk royaraqamia-1.0.3.apk
          gh release upload android-1.0.3 royaraqamia-1.0.3.apk

      - name: Verify what a device will fetch
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir -p verify

          check() { # <tag> <asset> <sha256>
            for attempt in 1 2 3; do
              if gh release download "$1" -p "$2" -D verify; then break; fi
              echo "download attempt $attempt failed"
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
            got=$(sha256sum "verify/$2" | cut -d' ' -f1)
            echo "$1  $2  $got"
            if [ "$got" != "$3" ]; then
              echo "::error title=Wrong bytes::$1/$2 does not hash to what it was published as"
              exit 1
            fi
          }

          check android-1.0.1 royaraqamia-1.0.1.apk 83287d303d9cd6cd1b228e13fbef100522ea46a1181ee91ec814ec43469f8e75
          check android-1.0.2 royaraqamia-1.0.2.apk ec821645e00ecbf58f5ca6b8bc80d1b6a6e600e79cddf866adc83a4b9f0e3bfb
          check android-1.0.3 royaraqamia-1.0.3.apk 78fe6c833d07bb8512d0bfc468739cd086eb2de52fe7ccd08a68e50679edafad

      - name: Point the manifest at the renamed asset
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          before=$(jq -r .sha256 public/android/latest.json)
          node -e '
            const fs = require("node:fs");
            const path = "public/android/latest.json";
            const text = fs.readFileSync(path, "utf8");
            const next = text.replace("royaraqamia-shell-1.0.3.apk", "royaraqamia-1.0.3.apk");
            if (next === text) throw new Error("the manifest does not name the old asset");
            fs.writeFileSync(path, next);
          '
          after=$(jq -r .sha256 public/android/latest.json)
          if [ "$before" != "$after" ]; then
            echo "::error title=The hash moved::a rename may not change the bytes the manifest names"
            exit 1
          fi
          jq -r .apkUrl public/android/latest.json

      - name: Land the manifest
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android/latest.json
          git commit -m "chore(android): name the published APK royaraqamia-1.0.3.apk"
          git fetch origin main --quiet
          git rebase origin/main
          git push origin HEAD:main

      - name: Retire the old spellings
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete-asset android-1.0.3 royaraqamia-shell-1.0.3.apk --yes
          gh release delete shell --yes --cleanup-tag
          echo "releases now:"
          gh release list --limit 8

      - name: Summary
        if: always()
        run: |
          {
            echo "### Legacy asset migration"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Dry run**: the historical bytes were downloaded and verified; nothing was uploaded, renamed or deleted."
            else
              echo "Published \`android-1.0.1\` and \`android-1.0.2\`, renamed the 1.0.3 asset, moved the manifest, retired the \`shell\` release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
