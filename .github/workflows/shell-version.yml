name: 'Shell Version'

# Two rules, both about the same file (ADR-0090).
#
# 1. `android/shell-version.properties` moves at the release cut, never in a pull
#    request. A branch that bumps it publishes a version the weekly train never
#    graded, and the train then grades the same commits again.
# 2. A change to the shell ships to users, so it carries a release note — the
#    Arabic sentence a person reads in the app's changelog. `android/release-notes/
#    unreleased/` is where it goes; the cut folds it into the release.
#
# It runs `node scripts/android-shell-version.mjs` and
# `node scripts/android-release.mjs`, which read a few files and shell out to
# `git` — no Android toolchain, no npm install — so it can afford to run on every
# pull request instead of on a path filter.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-version:
    name: A shell change is consistent and says what it does
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The comparison is against the base commit, so the whole history of
          # this branch has to be here.
          fetch-depth: 0

      - name: The version file is consistent and untouched
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: node scripts/android-shell-version.mjs --check "$BASE"

      - name: A shell change carries a release note
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: node scripts/android-release.mjs --check-notes "$BASE"
