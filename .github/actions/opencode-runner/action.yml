name: 'OpenCode Runner Setup'
description: >-
  Prepares a runner for an OpenCode agent job: installs the pinned Vercel CLI and
  writes the runner-only OpenCode config from `.github/opencode/runner.json`
  (Supabase MCP server, compaction pruning and the headless permission block).
  Shared by the autonomous agent workflows so the setup cannot drift between them.

inputs:
  supabase-project-ref:
    description: 'Supabase project reference, baked into the MCP server URL'
    required: true
  vercel-version:
    description: 'Pinned Vercel CLI version'
    required: false
    default: '63.1.0'

runs:
  using: 'composite'
  steps:
    - name: Install Vercel CLI
      # Pinned, global so the agent can call it directly.
      shell: bash
      run: |
        npm install --global vercel@${{ inputs.vercel-version }}
        vercel --version

    - name: Configure OpenCode (runner-only)
      # The settings an autonomous run needs live in `.github/opencode/runner.json`
      # rather than in a heredoc here, so a pull request can diff them and
      # `npm run check:runner-permissions` can prove no permission prompt is
      # reachable: a runner has nobody to answer one, and round 3 of 2026-11-08
      # spent 72 minutes proving it (ADR-0142). `compaction.prune` is not a
      # default upstream, and pruning old tool output is what keeps the context
      # of a long implementer or repair run from filling with stale reads.
      shell: bash
      env:
        SUPABASE_PROJECT_REF: ${{ inputs.supabase-project-ref }}
      run: node "$GITHUB_WORKSPACE/scripts/agents/runner-config.mjs" --write
