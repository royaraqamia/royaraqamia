# Paths that hold secret-looking values on purpose. Everything else in the repository is
# still scanned, and still blocked by push protection.
paths-ignore:
  # The Firebase client config (ADR-0050). Its `AIza…` Android key is a client identifier,
  # not a credential: every APK compiles it in and the APK is public (ADR-0047), so the file
  # is committed deliberately — leaving it out is what shipped a shell whose push plugin
  # killed the app. What protects the key is its Android-app restriction (package name +
  # signing SHA-1) in the Google Cloud console, not its publication. The FCM service-account
  # JSON, which *can* send to every device, is a different file and lives in Vercel. Note
  # that this also exempts the path from push protection, which is the point: a key rotation
  # edits the file, and `.gitleaks.toml` carries the same allowlist for CI.
  - 'android/app/google-services.json'
