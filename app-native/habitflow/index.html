<!doctype html>
<!--
  The bundled surface's document (issue #500, plan B).

  Served from the APK as `https://localhost/` by Capacitor's local server, which
  is why nothing here is absolute and why there is no service worker: this
  document's staleness is the APK's `versionCode` (#503), not a cache header.
  `class="dark"` mirrors `app/layout.tsx` — the site renders its dark theme
  unconditionally, and the `dark:` variant keys off this class.
-->
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="color-scheme" content="dark" />
    <title>HabitFlow — سبايك الأصلين</title>
    <link
      rel="preload"
      href="/fonts/Aref%20Ruqaa/ArefRuqaa-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="spike-root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
