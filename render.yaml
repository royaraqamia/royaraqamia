# RETIRED AS THE ORIGIN 2026-11-26 — KEPT AS THE ROLLBACK (ADR-0221).
# The site runs on the self-managed VPS and its runtime contract is
# `/opt/royaraqamia/.env`; this blueprint stays deployable so the DNS record can
# be pointed back until the owner signs off on the cutover, and is then deleted.
# Do not add a key here. A new runtime variable goes into the VPS env file and,
# when the build needs it, into the publish workflow's build args.
#
# Render blueprint — the site's origin while the Vercel Hobby caps are paused
# (ADR-0174). `sync: false` means "this key is required, but its value is set in
# the Render dashboard and never committed" — the blueprint lists the contract,
# the dashboard holds the secret.
#
# Native Node, not Docker, on purpose: the assistant's specialist roster is read
# from `.opencode/skills/agency/` at request time
# (`backend/services/chat/agency-skills.ts`). A Node service is built inside the
# cloned repository, so that directory is present and the roster works without a
# single extra copy step — an image would have to reproduce it by hand and would
# fail silently if it did not.
services:
  - type: web
    name: royaraqamia
    runtime: node
    # First upgrade, at the first paying user: `0.5c-512mb` ($7) doubles the CPU
    # to 0.5 and removes the spin-down, keeping the same 512 MB. `1c-2g` ($25)
    # is the 2 GB memory wall, not the CPU one.
    plan: free
    region: frankfurt
    branch: main
    # `build:render` is `npm run build` without `tsc --noEmit`: CI already gates
    # types on the pull request, and the build machine only needs the artifact.
    # It still runs the whole prebuild chain and the postbuild precache list.
    # `npm ci` honours the repository's `.npmrc` (`legacy-peer-deps`).
    #
    # The 6 GB heap belongs to this command, not to the service: collecting page
    # data died on "used over 8GB" once, and `next.config.js` already cuts the
    # worker pool when `RENDER` is set. The prefix ends with the build; the
    # runtime cap is `NODE_OPTIONS` below (ADR-0199).
    buildCommand: npm ci && NODE_OPTIONS=--max-old-space-size=6144 npm run build:render
    startCommand: npm start
    # A static file: a health check that touches the app would count against the
    # 0.1 CPU the free instance has, and would report unhealthy while a page is
    # being rendered rather than when the process is actually down.
    healthCheckPath: /manifest.json
    # A merge does not build. Hobby includes 500 pipeline minutes a month, and
    # this repository merges ~22 deploy-triggering commits a day: at the
    # recorded ~2m45 a build that is ~1,800 minutes, gone in the first week.
    # `.github/workflows/deploy.yml` calls the deploy hook only when it is
    # dispatched by hand (ADR-0209). A deploy hook ignores the build filter
    # below; the filter only governs an automatic deploy, so turning
    # auto-deploys back on stays safe.
    autoDeployTrigger: 'off'
    # A push that cannot change the running app does not spend a build when
    # auto-deploys return. `scripts/**` and `next.config.js` are deliberately
    # absent: the build runs them.
    buildFilter:
      ignoredPaths:
        - docs/**
        - android/**
        - e2e/**
        - .github/**
        - '**/*.md'
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # The runtime heap cap, and it has to stay near the instance: 512 MB of
      # container with ~100 MB of non-heap RSS leaves ~360 MB for the heap.
      # `--max-old-space-size=384` caps the old generation; V8 reports a 576 MB
      # total heap limit with the young generation on top, which is close enough
      # to the wall that collection runs while the instance is still alive.
      #
      # It used to read 6144 here, carrying the build's cap into `next start` as
      # a service variable — V8 was told it had a ~6.3 GB heap, collected later
      # than the container could afford, and the instance was killed at 512 MB
      # while nearly idle (2026-11-15, ADR-0199).
      - key: NODE_OPTIONS
        value: --max-old-space-size=384

      # Inlined at build time by Next, so they have to exist before
      # `next build` runs, not only at boot.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://royaraqamia.com
      # The runtime origin every absolute URL is built from (ADR-0178). The
      # build-time value above is what the browser inlines; this one is what the
      # server reads, so a preview environment can differ without a rebuild.
      - key: PUBLIC_ORIGIN
        value: https://royaraqamia.com
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false

      # Runtime configuration and secrets.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        sync: false
      - key: SENTRY_DSN
        sync: false
      # The build uploads source maps only when all three of the org, the project
      # and the token are set; with the token alone the build still runs, it just
      # reports minified stacks (`next.config.js`).
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: MCP_TOKEN_ENCRYPTION_KEY
        sync: false
      # The coding agent's GitHub App (ADR-0219). Its installation tokens are
      # encrypted with the key above; neither the App secret nor the PEM is
      # committed to the blueprint.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: PENDING_LOGIN_SECRET
        sync: false
      - key: PASSWORD_BREACH_CHECK_ENABLED
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_WEBHOOK_TOKEN
        sync: false
      - key: PUSH_ENDPOINT_ALLOWLIST
        sync: false
      # The three scheduled jobs authenticate with this (`Authorization: Bearer
      # <CRON_SECRET>`); the workflow that calls them reads the same value from
      # the repository's Actions secrets.
      - key: CRON_SECRET
        sync: false
      - key: DOWNLOADER_PROVIDER_URL
        sync: false
      - key: DOWNLOADER_PROVIDER_TOKEN
        sync: false
      - key: DOWNLOADER_CALLBACK_SECRET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: ANONYMOUS_IP_SALT
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      # The assistant's web search (ADR-0206). The value is set in the Render
      # dashboard, never in this blueprint; without it no search tool is declared
      # and نور answers exactly as before.
      - key: TAVILY_API_KEY
        sync: false
      # The specialist shortlist's vectors (ADR-0190): the chat gateway serves
      # no embedding model, so this is a second OpenAI-compatible provider on
      # the account that already hosts R2. The model and its width are constants
      # here because the committed artifact must match them exactly; the URL
      # carries the account id and the token is a secret, so both stay in the
      # dashboard.
      - key: AI_EMBEDDING_BASE_URL
        sync: false
      - key: AI_EMBEDDING_API_KEY
        sync: false
      - key: AI_EMBEDDING_MODEL
        value: '@cf/baai/bge-m3'
      - key: AI_EMBEDDING_DIMENSIONS
        value: '1024'
      - key: MCP_STATIC_CLIENT_GITHUB_ID
        sync: false
      - key: MCP_STATIC_CLIENT_GITHUB_SECRET
        sync: false
      - key: MCP_CATALOG_AGENT_TOKEN
        sync: false
