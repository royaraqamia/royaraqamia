# The Android shell's version (ADR-0043, ADR-0090)
#
# Deliberately independent of package.json#version: this is a remote-URL shell
# (ADR-0036), so a web deploy changes nothing about the installed app. This file
# moves only when the shell itself changes — `android/**`, the Capacitor config,
# or a Capacitor plugin dependency — and that is what "a new APK exists" means.
#
# It moves at the release cut, in the weekly train, and never in a pull request:
# a single merge used to be a whole APK for every user, twenty-one of them in the
# shell's first weeks (ADR-0090). The train grades everything native that
# accumulated, writes the one version that batch earned, and publishes it.
#
#   shellVersionName  1.<minor>.<patch>          the number a user reads
#   shellVersionCode  20000 + (major-1)*10000 + minor*100 + patch
#
# The code is derived from the name, never typed: 1.0.21 is 20021, 1.1.0 is
# 20100, 2.0.0 is 30000. Android compares the code and refuses a downgrade; the
# name is what the app info screen, the release tag (`android-1.1.0`) and the APK
# file name carry. `scripts/android-shell-version.mjs --check` fails a tree where
# the two disagree, or a pull request that hand-edits this file.
#
# 20000 is the base on purpose. Until this file existed, versionCode came from
# the site version (major * 10000 + minor * 100 + patch), so a device with 1.91.x
# installed is at 19100 and refuses anything lower — the first emulator drill
# with a counter of 1 ended in INSTALL_FAILED_VERSION_DOWNGRADE against 1.88.4.
shellVersionName=1.0.21
shellVersionCode=20021
