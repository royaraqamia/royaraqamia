# The Android shell's own version counter (ADR-0043).
#
# Deliberately independent of package.json#version: this is a remote-URL shell
# (ADR-0036), so a web release changes nothing about the installed app. This
# number moves only when the shell itself changes — `android/**`, the Capacitor
# config, or a Capacitor plugin dependency — and that is what "a new APK exists"
# means. public/android/latest.json is compared against it, so a counter that
# moves with the web release would announce an APK that does not exist.
#
# It starts at 20000 on purpose. Until this file existed, versionCode was
# derived from the site version (major * 10000 + minor * 100 + patch), so an
# installed shell is at 19100 for 1.91.x and anything below that is a downgrade
# Android refuses to install — which is how the first emulator drill with a
# counter of 1 ended: INSTALL_FAILED_VERSION_DOWNGRADE against the 1.88.4 build
# that was already on the device. 20000 is above every code the old scheme could
# produce for a 1.x release, and the two schemes never need to agree again.
#
# Bump it in the same pull request as the native change:
#   npm run android:shell-version -- --bump
# `npm run android:shell-version -- --check <ref>` is what CI runs, and it fails
# a pull request that changed the shell without bumping this.
#
# shellVersionName is derived from the counter and never typed:
#   1.<minor>.<patch>, minor and patch taken from (counter - 20000).
# It is the name a user reads. It names the release (`android-1.0.3`), the asset
# (`royaraqamia-shell-1.0.3.apk`), and the APK's own versionName. `--bump` writes
# both lines, and `--check` fails a tree where the two disagree — so the number in
# the app always describes the APK that carries it.
shellVersionName=1.0.10
shellVersionCode=20010
