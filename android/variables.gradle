ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    // The background drain's scheduler and its worker (ADR-0059). WorkManager is
    // the only Android background component this shell has; 2.10.x is the line
    // that still runs on `minSdkVersion 24`.
    androidxWorkVersion = '2.10.5'
    // The shell's own FCM receiver (ADR-0059, ADR-0060) extends
    // `FirebaseMessagingService`, and a plugin project's dependencies are not
    // transitive, so the app module declares the artifact itself. The pin is the
    // version `@capacitor/push-notifications` defaults to, so declaring it here
    // keeps the plugin and the shell on one version instead of two.
    firebaseMessagingVersion = '25.0.1'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    // JVM-side org.json: android.jar's copy is a stub in unit tests, and the
    // shell's manifest parsing (ShellUpdateTest, ADR-0043) needs the real one.
    jsonVersion = '20240303'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}