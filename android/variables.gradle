ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    // The background drain's scheduler and its worker (#651, ADR-0059).
    // WorkManager is the only Android background component this app has; 2.10.x
    // is the line that still runs on `minSdkVersion 24`.
    androidxWorkVersion = '2.10.5'
    // The shell's own FCM receiver (ADR-0059, ADR-0060) extends
    // `FirebaseMessagingService`, and a plugin project's dependencies are not
    // transitive, so the app module declares the artifact itself. The pin is the
    // version `@capacitor/push-notifications` defaults to, so declaring it here
    // keeps the plugin and the shell on one version instead of two.
    firebaseMessagingVersion = '25.0.1'
    // The native recitation (ADR-0086): ExoPlayer for the queue and the media3
    // session for the notification, the lock screen and the media keys.
    media3Version = '1.8.0'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    // JVM-side org.json: android.jar's copy is a stub in unit tests, and the
    // shell's manifest parsing (ShellUpdateTest, ADR-0043) needs the real one.
    jsonVersion = '20240303'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // The generated contract types and the codec that reads them (#648).
    kotlinxSerializationVersion = '1.9.0'
    // Compose, the app's UI toolkit (ADR-0089, #647). One BOM pins every Compose
    // artifact to the same release; the compiler plugin that has to match it
    // lives beside the Kotlin plugin in `build.gradle`, because a buildscript
    // classpath is resolved before this file is applied.
    composeBomVersion = '2025.12.01'
    // The shell's own baseline profile (#762): macrobenchmark generates it, the
    // uiautomator it drives the emulator with, and both are pinned here with the
    // other Android test dependencies. The generator plugin's own version is in
    // `build.gradle`, because a buildscript classpath is resolved first.
    benchmarkVersion = '1.4.1'
    uiautomatorVersion = '2.3.0'
    // Coroutines, for the session and every call a screen makes off the main
    // thread (#501). Compose already resolves them transitively; naming the
    // version here keeps the app's own code on one line instead of on whatever
    // the Compose classpath happens to bring.
    kotlinxCoroutinesVersion = '1.10.2'
    // HabitFlow's Local Store (#768). Room rather than the framework's
    // `SQLiteOpenHelper`: the schema is the migration, the exported schema is what
    // makes a missing migration a build failure, and a DAO is testable without a
    // device. `2.8.x` is the line that carries the KSP compiler and KMP artifacts.
    roomVersion = '2.8.5'
    // The store's DAO tests run on the JVM, not on an emulator (#768): a device
    // is where a screen is checked, and what a DAO does with a row is not
    // something to learn there. Robolectric supplies the Android runtime the
    // database needs.
    robolectricVersion = '4.17'
    androidxTestCoreVersion = '1.7.0'
}