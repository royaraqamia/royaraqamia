# The app's backend config (#770).
#
# Three public values, not secrets: the site's origin, the project's auth base and
# its publishable key. The key names the project and is what every browser request
# to Supabase already carries - the web bundle ships the same string - so what
# protects a row is RLS, not this file. It is committed for the reason
# google-services.json is (ADR-0050): a build that must reach a deployment needs
# the deployment's public names, and a value only a CI secret can supply makes a
# locally built release one that cannot sign in.
#
# ndroid/local.properties overrides all three (siteUrl, supabase.url,
# supabase.authUrl, supabase.anonKey), which is how a debug build is pointed at
# another project without touching this file.
siteUrl=https://royaraqamia.com
supabase.url=https://ievboaylytxgtijconak.supabase.co
supabase.authUrl=https://ievboaylytxgtijconak.supabase.co/auth/v1
supabase.anonKey=sb_publishable_S6OJdmRtfmL_trKAY1ypqQ_WZYRjVK2