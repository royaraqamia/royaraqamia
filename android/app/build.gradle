apply plugin: 'com.android.application'

// Both of these come from the shell's own counter file (android/shell-version.properties,
// ADR-0043), and neither has anything to do with package.json:
//
// - versionCode is an integer Android compares; it is the update key, and it
//   only moves when the native side moves.
// - versionName is what a user reads. It used to be the *web* version at build
//   time (`1.94.2+shell.20002`), which described nothing: this shell carries no
//   web code, it loads the live site, so that number was stale the moment the
//   site deployed. It is now the shell's own name, derived from the counter by
//   `scripts/android-shell-version.mjs` and written into the properties file —
//   so the app, the release tag and the APK cannot disagree about it.
//
// The web version is still there for support: the site knows it, and shows it.
def shellVersionFile = file('../shell-version.properties')
def shellVersionProperties = new Properties()
if (shellVersionFile.exists()) {
    shellVersionFile.withInputStream { shellVersionProperties.load(it) }
}
def shellVersionCode = (shellVersionProperties.getProperty('shellVersionCode') ?: '0').toInteger()
def shellVersionName = (shellVersionProperties.getProperty('shellVersionName') ?: "${shellVersionCode}")

// The upload keystore lives outside the repository (D:\Projects\royaraqamia-android-keys)
// and is referenced by a git-ignored keystore.properties, so credentials are
// never committed. Without the file, release builds are unsigned instead of
// failing — `assembleDebug` stays usable on a machine that has no keystore.
def keystorePropertiesFile = rootProject.file('../keystore.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// The Firebase client config is *committed* (ADR-0050): it holds the project id and the
// Android API key, which every APK ships anyway, and its absence is what let a released
// shell reach users with no Firebase app — where `@capacitor/push-notifications` throws
// and Capacitor rethrows the throw on its own plugin thread, killing the app. Two things
// follow from it being here:
//
// - `FIREBASE_CONFIGURED` tells `MainActivity` whether this build can serve the push
//   plugin, so a tree without the file withholds the plugin instead of crashing on it.
// - A *release* build refuses to run without it, because that is the build that reaches
//   a device through the update flow.
def servicesJSONFile = file('google-services.json')
def hasGoogleServices = servicesJSONFile.exists() && servicesJSONFile.length() > 0

android {
    namespace = "com.royaraqamia.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.royaraqamia.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode shellVersionCode
        // What the user sees in Android's app info and in the app's own footer.
        // The update check compares versionCode, never this.
        versionName shellVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Read by `MainActivity` before the bridge is built: a build with no Firebase
        // config must not offer the page a push plugin it cannot serve (ADR-0050).
        buildConfigField "boolean", "FIREBASE_CONFIGURED", hasGoogleServices.toString()
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    // The shell's update check compares BuildConfig.VERSION_CODE (the counter
    // above) with the published manifest, so BuildConfig has to be generated.
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The background drain: a WorkManager job that wakes with the app closed and
    // replays the Outbox in a headless WebView (ADR-0059).
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    // The recitation's player and its system controls (ADR-0086).
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    // The FCM receiver (ADR-0059, ADR-0060). `SyncMessagingService` extends
    // `FirebaseMessagingService`, so this module needs the messaging artifact on
    // its own classpath: `@capacitor/push-notifications` uses `implementation`,
    // which does not travel to a consumer.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:$jsonVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json is missing, google-services plugin not applied. Push Notifications won't work")
    // A release with no Firebase config is a shell whose push plugin throws where
    // Capacitor turns a plugin exception into a crash (ADR-0050). `assembleDebug` stays
    // usable — `MainActivity` withholds the plugin there, so the app degrades instead of
    // dying — but the build that ships does not.
    tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach { task ->
        task.doFirst {
            throw new GradleException(
                'google-services.json is missing: a released shell must be able to serve ' +
                'the push plugin it advertises. See docs/mobile/android-shell.md (ADR-0050).'
            )
        }
    }
}
