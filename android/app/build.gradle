apply plugin: 'com.android.application'
// The app's own code is Kotlin from here (ADR-0089, #648): the generated
// contract types, the codec, and the models built from them. The Java classes
// that survive are converted as they are touched, not in one pass.
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
// The app's UI toolkit from ADR-0089 onward. It is wired now, with the theme,
// so that the first screen lands as a screen rather than as a dependency change.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
// The shell's own baseline profile (#762): the plugin adds `generateBaselineProfile`,
// which runs the `:baselineprofile` module on the emulator below and saves what the
// launch compiled into this module's sources.
apply plugin: 'androidx.baselineprofile'
// Room's compiler (#768): the store's entities, DAO and database are written by
// hand, and what makes them a schema is the processor. KSP rather than KAPT,
// which the Kotlin plugin no longer carries a path for.
apply plugin: 'com.google.devtools.ksp'

// Both of these come from the shell's own counter file (android/shell-version.properties,
// ADR-0043), and neither has anything to do with package.json:
//
// - versionCode is an integer Android compares; it is the update key, and it
//   only moves when the native side moves.
// - versionName is what a user reads. It used to be the *web* version at build
//   time (`1.94.2+shell.20002`), which described nothing: this shell carries no
//   web code, it loads the live site, so that number was stale the moment the
//   site deployed. It is now the shell's own name, derived from the counter by
//   `scripts/android-shell-version.mjs` and written into the properties file —
//   so the app, the release tag and the APK cannot disagree about it.
//
// The web version is still there for support: the site knows it, and shows it.
def shellVersionFile = file('../shell-version.properties')
def shellVersionProperties = new Properties()
if (shellVersionFile.exists()) {
    shellVersionFile.withInputStream { shellVersionProperties.load(it) }
}
def shellVersionCode = (shellVersionProperties.getProperty('shellVersionCode') ?: '0').toInteger()
def shellVersionName = (shellVersionProperties.getProperty('shellVersionName') ?: "${shellVersionCode}")

// The upload keystore lives outside the repository (D:\Projects\royaraqamia-android-keys)
// and is referenced by a git-ignored keystore.properties, so credentials are
// never committed. Without the file, release builds are unsigned instead of
// failing — `assembleDebug` stays usable on a machine that has no keystore.
def keystorePropertiesFile = rootProject.file('../keystore.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// The debug workbench (#647, #501) signs in and reads a real route, so it needs the
// project's URL and its publishable key. Both are public by design — the key names the
// project and RLS decides what a token may read — but they are *this machine's*, so they
// live in the git-ignored `android/local.properties` rather than in the repository, and
// only the `debug` build type reads them. A release APK therefore carries neither the
// values nor a screen that could use them, and a pulled branch invents nothing.
def localPropertiesFile = rootProject.file('local.properties')
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def debugSupabaseUrl = localProperties.getProperty('supabase.url', '')
def debugSupabaseAnonKey = localProperties.getProperty('supabase.anonKey', '')

// The app's backend config (#770): the site's origin, the project's auth base and
// its publishable key. Committed in `android/supabase.properties` because all three
// are public - the key ships in the web bundle and RLS is what protects a row - and
// because a value only a CI secret can supply makes a locally built release one that
// cannot sign in. `android/local.properties` still overrides them per machine.
def supabasePropertiesFile = rootProject.file('supabase.properties')
def supabaseProperties = new Properties()
if (supabasePropertiesFile.exists()) {
    supabasePropertiesFile.withInputStream { supabaseProperties.load(it) }
}
def cfg = { String key, String fallback ->
    localProperties.getProperty(key, supabaseProperties.getProperty(key, fallback))
}
def siteUrl = cfg('siteUrl', 'https://royaraqamia.com')
def supabaseUrl = cfg('supabase.url', '')
def supabaseAuthUrl = cfg('supabase.authUrl', '')
def supabaseAnonKey = cfg('supabase.anonKey', '')
// The Firebase client config is *committed* (ADR-0050): it holds the project id and the
// Android API key, which every APK ships anyway, and its absence is what let a released
// shell reach users with no Firebase app — where `@capacitor/push-notifications` throws
// and Capacitor rethrows the throw on its own plugin thread, killing the app. Two things
// follow from it being here:
//
// - `FIREBASE_CONFIGURED` tells `MainActivity` whether this build can serve the push
//   plugin, so a tree without the file withholds the plugin instead of crashing on it.
// - A *release* build refuses to run without it, because that is the build that reaches
//   a device through the update flow.
def servicesJSONFile = file('google-services.json')
def hasGoogleServices = servicesJSONFile.exists() && servicesJSONFile.length() > 0

android {
    namespace = "com.royaraqamia.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.royaraqamia.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode shellVersionCode
        // What the user sees in Android's app info and in the app's own footer.
        // The update check compares versionCode, never this.
        versionName shellVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Read by `MainActivity` before the bridge is built: a build with no Firebase
        // config must not offer the page a push plugin it cannot serve (ADR-0050).
        buildConfigField "boolean", "FIREBASE_CONFIGURED", hasGoogleServices.toString()
        // What the app talks to (#770). Public values; see `android/supabase.properties`.
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_AUTH_URL", "\"${supabaseAuthUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Read by the debug-only workbench (`WorkbenchActivity`). Empty when
            // `android/local.properties` has no `supabase.url`/`supabase.anonKey`, and
            // the workbench then says so instead of starting a half-configured app.
        }
        release {
            // Compose costs about 5.4 MiB of dex before a single screen exists, and
            // the release budget is 20 MiB (docs/mobile/native-app.md). R8 pays for
            // it: the WebView, the plugins and the Compose stack are all reachable
            // from code the build can see, so shrinking takes far more than it costs
            // (ADR-0094). The `debug` build is not minified, which keeps stack traces
            // and `chrome://inspect` usable.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    // The shell's update check compares BuildConfig.VERSION_CODE (the counter
    // above) with the published manifest, so BuildConfig has to be generated.
    buildFeatures {
        buildConfig true
        compose true
    }
    testOptions {
        unitTests {
            // The store's DAO tests run on the JVM under Robolectric (#768),
            // which needs the module's resources and manifest to build an
            // Android runtime for them.
            includeAndroidResources = true
            // Robolectric's SDK 36 runtime reaches `jdk.internal.access` for the
            // shared-memory handle it sets up, which JDK 17+ hides unless the
            // module is opened. Without this every test in the class fails in
            // `setUpApplicationState`, before a line of the test runs.
            all { test ->
                test.jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
}

// The exported schema is committed (#768): Room writes the shape of version N to
// disk, so the migration from N-1 is reviewed beside the shape it migrates from,
// and a version bumped with no migration is visible in the diff rather than
// crashing on a device whose rows the destruction fallback took.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

baselineProfile {
    // Committed, so the profile is reviewed like the code it describes and CI can
    // see it change.
    saveInSrc = true
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Kotlin shares the module's Java bytecode target. The Capacitor sync writes
// Java 21 into `capacitor.build.gradle`, which is applied after this file, so
// the Kotlin side names the same target here.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // The generator of the shell's own baseline profile (#762): this is how the
    // app's plugin knows which module produces the profile it packs.
    baselineProfile project(':baselineprofile')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The background drain (#651): a WorkManager job that wakes with the app
    // closed and replays the Local Store's Outbox. `-ktx` is where
    // `CoroutineWorker` lives, and the drain is a suspending one.
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation "androidx.work:work-runtime-ktx:$androidxWorkVersion"
    // The recitation's player and its system controls (ADR-0086).
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    // The FCM receiver (ADR-0059, ADR-0060). `SyncMessagingService` extends
    // `FirebaseMessagingService`, so this module needs the messaging artifact on
    // its own classpath: `@capacitor/push-notifications` uses `implementation`,
    // which does not travel to a consumer.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    // The generated contract types decode through kotlinx.serialization (#648).
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationVersion"
    // The session and the HTTP client (#501): one client, awaited on IO, so a
    // screen never blocks a frame on a socket.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    // The app's own UI (ADR-0089, #647). The BOM pins the Compose artifacts to
    // one release, so the material3 behaviour baseline cannot arrive at a version
    // the runtime does not have.
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.material3:material3"
    // Compose's activity entry point (#647): `setContent` lives here, not in the
    // activity artifact the shell already depends on, so the app pins the same
    // activity version for both.
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:$jsonVersion"
    // The Local Store (#768): one database per identity, and the DAO that writes
    // a pull into it. `room-ktx` is what makes a `suspend` DAO a background
    // query rather than a main-thread one.
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    // The DAO's tests are JVM tests (#768), so Robolectric is the runtime that
    // makes a real SQLite file out of them; `room-testing` is what lets a
    // migration be opened at its previous version.
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    testImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json is missing, google-services plugin not applied. Push Notifications won't work")
    // A release with no Firebase config is a shell whose push plugin throws where
    // Capacitor turns a plugin exception into a crash (ADR-0050). `assembleDebug` stays
    // usable — `MainActivity` withholds the plugin there, so the app degrades instead of
    // dying — but the build that ships does not.
    tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach { task ->
        task.doFirst {
            throw new GradleException(
                'google-services.json is missing: a released shell must be able to serve ' +
                'the push plugin it advertises. See docs/mobile/android-shell.md (ADR-0050).'
            )
        }
    }
}
