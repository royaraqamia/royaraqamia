// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // The app is Kotlin from the first generated contract type onward
        // (ADR-0089, #648). Pinned here rather than in `variables.gradle`
        // because a buildscript classpath is resolved before that file is
        // applied; it is the only place either version is written.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.2.20'
        // Compose's compiler plugin ships with Kotlin now, and its version has to
        // be the Kotlin one (ADR-0089, #647).
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.20'
        // The generator of the shell's own baseline profile (#762). It is a
        // buildscript classpath for the same reason the Kotlin plugin is: the
        // module that applies it only exists once this is resolved. Pinned at
        // 1.4.1: 1.5.0 fails `:app:compileNonMinifiedReleaseKotlin` with a
        // `scriptSources` input that points at `provider(?)` under this Kotlin
        // and AGP pair, so moving it is a build change to prove, not a version
        // bump to take.
        classpath 'androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.4.1'
        // Room's compiler runs as a KSP processor (#768). The plugin is a
        // buildscript classpath for the same reason the Kotlin one is; its
        // version is the Kotlin version plus KSP's own suffix, so it is pinned
        // here beside the Kotlin plugin it has to match rather than in
        // `variables.gradle`, which is applied after this block is resolved.
        // Named by its own coordinates rather than the `gradle.plugin` marker:
        // the marker resolves from the plugin portal, which this network does
        // not reach, while the implementation artifact is on Maven Central.
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.20-2.0.4"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
