# Gitleaks configuration for رؤيَة رقَميَّة
# See: https://github.com/gitleaks/gitleaks
title = "Gitleaks config for royaraqamia"

[extend]
useDefault = true

[allowlist]
  description = "Intentional secret-like fixtures, placeholder templates, and client-public values"
  paths = [
    # Unit test that asserts example.env and configs contain NO real secrets;
    # it deliberately embeds secret-shaped regex patterns.
    '''scripts/__tests__/security-config\.test\.ts''',
    # The Firebase client config (ADR-0050). The API key it carries is compiled
    # into every APK, and the APK is public — the manifest points at
    # https://royaraqamia.com/android/royaraqamia-1.0.3.apk — so the file was
    # never a secret: ignoring it only produced builds with no Firebase app,
    # where `PushNotifications.register()` throws on Capacitor's plugin thread
    # and kills the app. What protects the key is its Android-app restriction
    # (package name + signing SHA-1) in the Google Cloud console, not its
    # publication; the FCM service-account JSON, which can send to every device,
    # is a different file and stays in Vercel's environment variables.
    '''android/app/google-services\.json''',
  ]
  regexes = [
    # NEXT_PUBLIC_* values are client-public by design (AGENTS.md / SECURITY.md):
    # they are inlined into the browser bundle and never treated as secrets.
    # Covers publishable/anon keys declared in CI workflows and example.env.
    '''NEXT_PUBLIC_[A-Z0-9_]+["']?\s*[:=]\s*[^"'\n]+["']?''',
    # Modern Supabase publishable/anon tokens (matched against the detected
    # secret itself, which does not carry the NEXT_PUBLIC_ variable name).
    '''sb_publishable_[A-Za-z0-9_-]+''',
    # FCM device-token test fixture, pinned as an exact literal rather than a
    # token shape so a real registration token committed later is still caught.
    # The value only exists in history (commit b7acd101) — the tree now uses a
    # low-entropy placeholder — but the weekly full-history scan still sees it.
    '''fMs6Q0abcDEF''',
  ]
